name: STAGING CANON Deploy

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/staging-deploy-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-staging-change
  cancel-in-progress: false

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_D1_NAME: nuevo-amanecer-staging
      STAGING_R2_BUCKET: nuevo-amanecer-staging-artifacts
      STAGING_BACKEND_URL: https://nuevo-amanecer-pos-staging.nuevo-amanecer-pos.workers.dev
      STAGING_WEB_URL: https://nuevo-amanecer-pos-web-staging.nuevo-amanecer-pos.workers.dev

    steps:
      - name: Checkout authorization event
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate owner-authorized staging trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          STAGING_TARGET_HEAD="$(node <<'NODE'
          const { readFileSync } = require("node:fs");
          const t = JSON.parse(readFileSync("ops/staging-deploy-trigger.json","utf8"));
          if (t.authorized !== true || t.authorized_by !== "owner") throw new Error("staging deploy not owner-authorized");
          if (t.target_branch !== "feature/v1.3-mobile-cloud") throw new Error("wrong staging target branch");
          if (t.requested_action !== "deploy-staging") throw new Error("wrong staging action");
          if (!/^[0-9a-f]{40}$/.test(t.target_head || "")) throw new Error("invalid staging target head");
          process.stdout.write(t.target_head);
          NODE
          )"
          echo "STAGING_TARGET_HEAD=$STAGING_TARGET_HEAD" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$STAGING_TARGET_HEAD" "$GITHUB_SHA"

      - name: Checkout exact staging target
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/v1.3-mobile-cloud --depth=50
          git cat-file -e "$STAGING_TARGET_HEAD^{commit}"
          git checkout --detach "$STAGING_TARGET_HEAD"

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install pinned Wrangler
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Validate staging isolation before remote access
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cloud-sync/staging-isolation-contract.test.mjs tests/cloud-sync/staging-runtime-boundary.test.mjs tests/cloud-sync/staging-deploy-workflow.test.mjs

      - name: Provision or reuse isolated STAGING D1 and R2
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { appendFileSync } = require("node:fs");
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          const d1Name=process.env.STAGING_D1_NAME, r2Name=process.env.STAGING_R2_BUCKET;
          async function cf(path, options={}) {
            const response=await fetch("https://api.cloudflare.com/client/v4/accounts/"+account+path,{...options,headers:{authorization:"Bearer "+token,"content-type":"application/json",...(options.headers||{})}});
            const body=await response.json().catch(()=>null);
            if(!response.ok || body?.success!==true) throw new Error("Cloudflare API "+path+" failed status="+response.status);
            return body.result;
          }
          (async()=>{
            let databases=await cf("/d1/database?per_page=100");
            let db=(Array.isArray(databases)?databases:[]).find(x=>x.name===d1Name);
            if(!db){ db=await cf("/d1/database",{method:"POST",body:JSON.stringify({name:d1Name})}); }
            if(!db?.uuid || db.name!==d1Name) throw new Error("staging D1 provisioning mismatch");
            let buckets=await cf("/r2/buckets?per_page=100");
            let bucket=(buckets?.buckets||[]).find(x=>x.name===r2Name);
            if(!bucket){ bucket=await cf("/r2/buckets",{method:"POST",body:JSON.stringify({name:r2Name})}); }
            if(bucket?.name!==r2Name) throw new Error("staging R2 provisioning mismatch");
            appendFileSync(process.env.GITHUB_ENV,"STAGING_D1_DATABASE_ID="+db.uuid+"\n");
            console.log(JSON.stringify({state:"STAGING_RESOURCES_READY",database_name:d1Name,r2_bucket:r2Name}));
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE

      - name: Render isolated backend config
        shell: bash
        run: |
          set -euo pipefail
          node tools/cloudflare-staging/scripts/render-backend-config.mjs
          ! grep -Fq "__STAGING_D1_DATABASE_ID__" tools/cloudflare-staging/wrangler.backend.generated.jsonc

      - name: Apply neutral migrations to STAGING only
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 migrations apply "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc

      - name: Seed synthetic canonical baseline when empty
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="$(npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --json --command "SELECT mode,active_promotion_id FROM canonical_control WHERE id=1")"
          MODE="$(printf '%s' "$CONTROL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=Array.isArray(x)?x[0]:x;process.stdout.write(String(r?.results?.[0]?.mode||""))})')"
          PROMO="$(printf '%s' "$CONTROL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=Array.isArray(x)?x[0]:x;process.stdout.write(String(r?.results?.[0]?.active_promotion_id||""))})')"
          if test "$MODE" = "LEGACY"; then
            npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --file ../cloudflare-staging/synthetic-seed.sql
          elif test "$MODE" = "CANONICAL_READ_ONLY" || test "$MODE" = "ACTIVE"; then
            test "$PROMO" = "staging-synthetic-promotion-v1"
          else
            echo "Unexpected staging canonical mode: $MODE" >&2
            exit 1
          fi

      - name: Activate synthetic STAGING authority and restore guard
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          CONTROL="$(npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --json --command "SELECT mode,active_promotion_id FROM canonical_control WHERE id=1")"
          MODE="$(printf '%s' "$CONTROL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=Array.isArray(x)?x[0]:x;process.stdout.write(String(r?.results?.[0]?.mode||""))})')"
          PROMO="$(printf '%s' "$CONTROL" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=Array.isArray(x)?x[0]:x;process.stdout.write(String(r?.results?.[0]?.active_promotion_id||""))})')"
          test "$PROMO" = "staging-synthetic-promotion-v1"
          restore_guard() {
            npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --file ../../infra/database/migrations/0013_canonical_expenses.sql >/dev/null
          }
          if test "$MODE" = "CANONICAL_READ_ONLY"; then
            trap restore_guard EXIT
            npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --command "DROP TRIGGER canonical_control_no_legacy; UPDATE canonical_control SET mode='ACTIVE',revision=revision+1,authority_epoch=authority_epoch+1,minimum_client_contract='a6-gate-c-v1' WHERE id=1 AND mode='CANONICAL_READ_ONLY' AND active_promotion_id='staging-synthetic-promotion-v1';"
            restore_guard
            trap - EXIT
          elif test "$MODE" != "ACTIVE"; then
            echo "Cannot activate staging from mode=$MODE" >&2
            exit 1
          fi
          VERIFY="$(npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --json --command "SELECT c.mode,c.active_promotion_id,c.minimum_client_contract,(SELECT COUNT(*) FROM products WHERE promotion_id=c.active_promotion_id) products,(SELECT COUNT(*) FROM customers WHERE promotion_id=c.active_promotion_id) customers,EXISTS(SELECT 1 FROM sqlite_master WHERE type='trigger' AND name='canonical_control_no_legacy') guard_restored FROM canonical_control c WHERE c.id=1")"
          printf '%s' "$VERIFY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);const r=(Array.isArray(x)?x[0]:x)?.results?.[0];if(!r||r.mode!=="ACTIVE"||r.active_promotion_id!=="staging-synthetic-promotion-v1"||r.minimum_client_contract!=="a6-gate-c-v1"||Number(r.products)<1||Number(r.customers)<1||Number(r.guard_restored)!==1)process.exit(2);console.log(JSON.stringify({state:"STAGING_SYNTHETIC_ACTIVE",products:Number(r.products),customers:Number(r.customers),guard_restored:true}))})'

      - name: Backend dry-run and deploy
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config ../cloudflare-staging/wrangler.backend.generated.jsonc
          npx wrangler deploy --config ../cloudflare-staging/wrangler.backend.generated.jsonc

      - name: Generate and bind STAGING-only activation secret
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$SECRET"
          echo "STAGING_ACTIVATION_SECRET=$SECRET" >> "$GITHUB_ENV"
          printf '%s' "$SECRET" | npx wrangler secret put POS_ACTIVATION_SECRET --config ../cloudflare-staging/wrangler.backend.generated.jsonc

      - name: Assemble the exact staging POS shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/cloudflare-pos-web/_site
          mkdir -p tools/cloudflare-pos-web/_site/app
          cp -a POS/. tools/cloudflare-pos-web/_site/app/
          cp tools/cloudflare-pos-web/public/index.html tools/cloudflare-pos-web/_site/index.html
          cp tools/cloudflare-pos-web/public/activate.js tools/cloudflare-pos-web/_site/activate.js
          sed -i "s/__BUILD_HASH__/$STAGING_TARGET_HEAD/g" tools/cloudflare-pos-web/_site/index.html
          sed -i "s/__BUILD_HASH__/$STAGING_TARGET_HEAD/g" tools/cloudflare-pos-web/_site/app/sw.js
          grep -Fq "$STAGING_TARGET_HEAD" tools/cloudflare-pos-web/_site/index.html
          grep -Fq "$STAGING_TARGET_HEAD" tools/cloudflare-pos-web/_site/app/sw.js

      - name: Seal immutable STAGING site candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/na-release-candidate /tmp/na-site.tar /tmp/na-site.tar.gz
          mkdir -p /tmp/na-release-candidate/site
          cp -a tools/cloudflare-pos-web/_site/. /tmp/na-release-candidate/site/
          node tools/release/site-artifact.mjs build             /tmp/na-release-candidate/site             "$STAGING_TARGET_HEAD"             /tmp/na-release-candidate/site-manifest.json
          SITE_MANIFEST_SHA256="$(sha256sum /tmp/na-release-candidate/site-manifest.json | awk '{print $1}')"
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner             -C /tmp/na-release-candidate -cf /tmp/na-site.tar site site-manifest.json
          gzip -n -c /tmp/na-site.tar > /tmp/na-site.tar.gz
          SITE_ARTIFACT_SHA256="$(sha256sum /tmp/na-site.tar.gz | awk '{print $1}')"
          test -n "$SITE_MANIFEST_SHA256"
          test -n "$SITE_ARTIFACT_SHA256"
          echo "SITE_MANIFEST_SHA256=$SITE_MANIFEST_SHA256" >> "$GITHUB_ENV"
          echo "SITE_ARTIFACT_SHA256=$SITE_ARTIFACT_SHA256" >> "$GITHUB_ENV"

      - name: STAGING web dry-run and deploy
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --dry-run --config ../cloudflare-staging/wrangler.web.template.jsonc
          npx wrangler deploy --config ../cloudflare-staging/wrangler.web.template.jsonc

      - name: Smoke STAGING backend and web
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            HEALTH="$(curl -sS --max-time 15 "$STAGING_BACKEND_URL/health" || true)"
            if printf '%s' "$HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.ok===true&&x.environment==="staging"&&x.service==="nuevo-amanecer-pos-staging"&&x.d1==="ok"?0:1)}catch{process.exit(1)}})'; then break; fi
            if test "$attempt" = "20"; then echo "STAGING backend health failed" >&2; exit 1; fi
            sleep 3
          done
          ACTIVATE="$(curl --fail --silent --show-error -X POST -H "x-activation-secret: $STAGING_ACTIVATION_SECRET" "$STAGING_BACKEND_URL/auth/activate")"
          TOKEN="$(printf '%s' "$ACTIVATE" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(typeof x.session_token!=="string"||!x.session_token)process.exit(2);process.stdout.write(x.session_token)})')"
          echo "::add-mask::$TOKEN"
          SESSION="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$STAGING_BACKEND_URL/auth/session")"
          SESSION_ID="$(printf '%s' "$SESSION" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(typeof x.session_id!=="string"||!x.session_id)process.exit(2);process.stdout.write(x.session_id)})')"
          echo "STAGING_SMOKE_SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
          STATUS="$(curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$STAGING_BACKEND_URL/read/canonical/status")"
          printf '%s' "$STATUS" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.authority!=="canonical"||x.mode!=="ACTIVE"||x.promotion_id!=="staging-synthetic-promotion-v1"||Number(x.counts?.products)<1||Number(x.counts?.customers)<1)process.exit(2);console.log(JSON.stringify({state:"STAGING_CANONICAL_SMOKE_PASS",mode:x.mode,promotion_id:x.promotion_id}))})'
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$STAGING_BACKEND_URL/read/canonical/products?limit=5" >/tmp/staging-products.json
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$STAGING_BACKEND_URL/read/canonical/customers?limit=5" >/tmp/staging-customers.json
          LAB_CODE="$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_BACKEND_URL/lab/workspace")"
          test "$LAB_CODE" = "404"
          CONFIG="$(curl --fail --silent --show-error "$STAGING_WEB_URL/runtime-config.js")"
          printf '%s' "$CONFIG" | grep -Fq '"environment":"staging"'
          printf '%s' "$CONFIG" | grep -Fq "$STAGING_WEB_URL"
          ! printf '%s' "$CONFIG" | grep -Fq "nuevo-amanecer-pos-prod"
          WEB_HEALTH="$(curl --fail --silent --show-error "$STAGING_WEB_URL/health")"
          printf '%s' "$WEB_HEALTH" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const x=JSON.parse(s);if(x.ok!==true||x.environment!=="staging"||x.service!=="nuevo-amanecer-pos-staging"||x.d1!=="ok")process.exit(2)})'
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$STAGING_WEB_URL/auth/session" >/tmp/staging-web-session.json
          curl --fail --silent --show-error -H "Authorization: Bearer $TOKEN" "$STAGING_WEB_URL/read/canonical/status" >/tmp/staging-web-status.json
          node -e 'const fs=require("node:fs");const s=JSON.parse(fs.readFileSync("/tmp/staging-web-session.json","utf8"));const x=JSON.parse(fs.readFileSync("/tmp/staging-web-status.json","utf8"));if(typeof s.session_id!=="string"||!s.session_id||x.authority!=="canonical"||x.mode!=="ACTIVE"||x.promotion_id!=="staging-synthetic-promotion-v1")process.exit(2)'
          curl --fail --silent --show-error -o /tmp/staging-root.html "$STAGING_WEB_URL/"
          curl --fail --silent --show-error -o /tmp/staging-app.html "$STAGING_WEB_URL/app/"
          grep -Fq "Nuevo Amanecer POS" /tmp/staging-root.html
          grep -Fq "Nuevo Amanecer — ERP &amp; POS" /tmp/staging-app.html

      - name: Publish smoke-verified immutable release candidate
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/na-site.tar.gz
          test -f /tmp/na-release-candidate/site-manifest.json
          test "$(sha256sum /tmp/na-site.tar.gz | awk '{print $1}')" = "$SITE_ARTIFACT_SHA256"
          test "$(sha256sum /tmp/na-release-candidate/site-manifest.json | awk '{print $1}')" = "$SITE_MANIFEST_SHA256"
          ARTIFACT_KEY="release-candidates/$STAGING_TARGET_HEAD/$SITE_ARTIFACT_SHA256/pos-site.tar.gz"
          CANDIDATE_KEY="release-candidates/$STAGING_TARGET_HEAD/candidate.json"
          npx wrangler r2 object put "$STAGING_R2_BUCKET/$ARTIFACT_KEY" --file=/tmp/na-site.tar.gz
          cat > /tmp/release-candidate.json <<EOF
          {
            "format": "nuevo-amanecer-pos-release-candidate-v1",
            "status": "STAGING_SMOKE_PASS",
            "target_head": "$STAGING_TARGET_HEAD",
            "artifact_key": "$ARTIFACT_KEY",
            "artifact_sha256": "$SITE_ARTIFACT_SHA256",
            "site_manifest_sha256": "$SITE_MANIFEST_SHA256",
            "staging_run_id": "$GITHUB_RUN_ID",
            "staging_web_url": "$STAGING_WEB_URL",
            "data_policy": "synthetic-only"
          }
          EOF
          npx wrangler r2 object put "$STAGING_R2_BUCKET/$CANDIDATE_KEY" --file=/tmp/release-candidate.json
          echo "STAGING_ARTIFACT_KEY=$ARTIFACT_KEY" >> "$GITHUB_ENV"
          echo "STAGING_CANDIDATE_KEY=$CANDIDATE_KEY" >> "$GITHUB_ENV"

      - name: Cleanup smoke browser session
        if: ${{ always() && env.STAGING_SMOKE_SESSION_ID != '' && env.STAGING_D1_DATABASE_ID != '' }}
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          npx wrangler d1 execute "$STAGING_D1_NAME" --remote --config ../cloudflare-staging/wrangler.backend.generated.jsonc --command "DELETE FROM auth_sessions WHERE session_id='$STAGING_SMOKE_SESSION_ID'; DELETE FROM devices WHERE device_id='session:$STAGING_SMOKE_SESSION_ID';" || true

      - name: STAGING deployment summary
        shell: bash
        run: |
          {
            echo "## Nuevo Amanecer — STAGING CANON"
            echo "- Status: DEPLOYED_AND_SMOKE_VERIFIED"
            echo "- Data: SYNTHETIC ONLY"
            echo "- Backend: $STAGING_BACKEND_URL"
            echo "- Web: $STAGING_WEB_URL"
            echo "- D1: $STAGING_D1_NAME"
            echo "- R2: $STAGING_R2_BUCKET"
            echo "- Target: $STAGING_TARGET_HEAD"
            echo "- Candidate: $STAGING_CANDIDATE_KEY"
            echo "- Artifact SHA-256: $SITE_ARTIFACT_SHA256"
            echo "- Site manifest SHA-256: $SITE_MANIFEST_SHA256"
            echo "- Production resources touched: NO"
          } >> "$GITHUB_STEP_SUMMARY"
