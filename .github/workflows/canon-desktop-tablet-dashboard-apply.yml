        </div>

        <div class="section-label menu-modules-label">Módulos principales</div>
        <div class="modules-grid">
            <div class="module-card" style="--accent:#00bca4;--icon-bg:#e0f7f4" onclick="goPage('pagePOS')"><div class="module-badge">POS</div><div class="module-icon">🛒</div><div class="module-label">Punto de Venta</div><div class="module-desc">Cobrar, registrar ventas y emitir comprobantes.</div><div class="module-arrow">Entrar →</div></div>
            <div class="module-card" style="--accent:#ff7043;--icon-bg:#fff3ef" onclick="goPage('pageInventario')"><div class="module-icon">📦</div><div class="module-label">Inventario</div><div class="module-desc">Control de stock, ingresos y productos críticos.</div><div class="module-arrow">Entrar →</div></div>
