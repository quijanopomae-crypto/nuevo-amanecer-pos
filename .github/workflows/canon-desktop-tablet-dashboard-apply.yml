name: CANON Desktop Tablet Dashboard Apply

on:
  push:
    branches:
      - fix/canon-desktop-tablet-dashboard-20261003
    paths:
      - ".github/workflows/canon-desktop-tablet-dashboard-apply.yml"
      - "tools/canon-desktop-tablet-dashboard-apply.py"
      - "tests/product-fixes/canon-desktop-tablet-dashboard.test.mjs"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/canon-desktop-tablet-dashboard-20261003
          fetch-depth: 1

      - name: Require exact scoped branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/canon-desktop-tablet-dashboard-20261003"

      - name: Apply bounded dashboard patch
        run: python3 tools/canon-desktop-tablet-dashboard-apply.py

      - name: Verify focused dashboard regression
        shell: bash
        run: |
          set -euo pipefail
          node --check POS/js/legacy-inline/inline-02.js
          node --test tests/product-fixes/canon-desktop-tablet-dashboard.test.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' POS/css/experience-v2/pages/menu.css POS/index.html POS/js/legacy-inline/inline-02.js | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded CANON dashboard
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS/index.html POS/css/experience-v2/pages/menu.css POS/js/legacy-inline/inline-02.js
          git commit -m "ui(canon): rediseñar Inicio para PC y tablet"
          git push origin HEAD:fix/canon-desktop-tablet-dashboard-20261003
