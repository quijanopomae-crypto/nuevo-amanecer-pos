name: CANON Desktop Tablet Dashboard Apply

on:
  push:
    branches:
      - fix/canon-desktop-tablet-dashboard-20261003
    paths:
      - ".github/workflows/canon-desktop-tablet-dashboard-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/canon-desktop-tablet-dashboard-20261003
          fetch-depth: 1

      - name: Require exact scoped branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/canon-desktop-tablet-dashboard-20261003"

      - name: Apply bounded desktop and tablet dashboard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          index = Path('POS/index.html')
          html = index.read_text(encoding='utf-8')
          start_marker = '<div class="page active" id="pageMenu">'
          end_marker = '\n<!-- POS -->'
          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start < 0 or end < 0 or html.find(start_marker, start + 1) >= 0:
              raise SystemExit('pageMenu markers are not unique')

          menu = r'''<div class="page active" id="pageMenu">
