            <div class="module-card" style="--accent:#f59e0b;--icon-bg:#fffbeb" onclick="goPage('pageCaja')"><div class="module-icon">💰</div><div class="module-label">Caja</div><div class="module-desc">Apertura, cierre diario y control de efectivo.</div><div class="module-arrow">Entrar →</div></div>
            <div class="module-card" style="--accent:#ef4444;--icon-bg:#fef2f2" onclick="goPage('pageGastos')"><div class="module-icon">🧾</div><div class="module-label">Gastos</div><div class="module-desc">Egresos, compras y salidas de dinero.</div><div class="module-arrow">Entrar →</div></div>
