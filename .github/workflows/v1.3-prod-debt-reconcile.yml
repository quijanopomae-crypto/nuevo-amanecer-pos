name: V1.3 Production Debt Reconciliation

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-prod-debt-reconcile-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb

    steps:
      - name: Checkout exact authorized HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require exact active branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate reconciliation script
        run: node --check tools/cloudflare-prod/scripts/debt-reconcile-secure.mjs

      - name: Run owner-authorized debt reconciliation stage
        run: node tools/cloudflare-prod/scripts/debt-reconcile-secure.mjs
