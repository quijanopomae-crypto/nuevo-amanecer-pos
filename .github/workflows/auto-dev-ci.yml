name: AUTO-DEV CI

on:
  pull_request:
  push:
    branches:
      - feature/v1.3-mobile-cloud
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-dev-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Una sola verificacion externa. Los tres trabajos se ejecutan en paralelo:
# contratos y permisos, negocio, navegador. El workflow es SUCCESS solo si todos lo son.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Fast CI and deployment contracts
        run: node --test tests/ci/*.test.mjs

      - name: Role, command and repository-map boundaries
        run: node --test tests/opencode-role-map.test.mjs tests/repo-map.test.mjs

      - name: Final repository boundaries
        run: node --test tests/final-repository-boundaries.test.mjs tests/security-secret-separation.test.mjs tests/cloud-sync/canon-dormant-schema.test.mjs

      - name: Owner finalizer safety
        run: node --test tests/owner-finalizer.test.mjs

      - name: Scoped release safety regressions
        run: node --test tests/release/*.test.mjs

      - name: Python validator syntax
        run: python -m py_compile orchestrator/project_validation.py orchestrator/snapshot.py tests/infrastructure/test_shadow_mode.py

      - name: Working tree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  critical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/cloudflare-lab/package-lock.json

      - name: Classify changes (safe on unknown history)
        id: impact
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] &&
             ! [[ "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$TARGET_SHA^{commit}"; then
            git diff --no-renames --name-only "$BASE_SHA" "$TARGET_SHA" > /tmp/na-changed-paths.txt
            node tools/ci/change-impact.mjs /tmp/na-changed-paths.txt | tee -a "$GITHUB_OUTPUT"
          else
            echo "level=critical" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: CANON UI and repository architecture contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/product-fixes/canon-motion-bootstrap.test.mjs \
            tests/product-fixes/canonical-ui-contract.test.mjs \
            tests/product-fixes/canon-whatsapp-receipts.test.mjs \
            tests/repo-map.test.mjs \
            tests/opencode-role-map.test.mjs \
            tests/owner-finalizer.test.mjs \
            tests/security-secret-separation.test.mjs

      - name: Assistant invoice and product creation regressions
        if: steps.impact.outputs.level != 'visual'
        shell: bash
        run: |
          node --test tests/asistente/assistant-settings.test.mjs tests/asistente/assistant-invoice-memory.test.mjs tests/asistente/assistant-invoice-products.test.mjs tests/asistente/assistant-admin.test.mjs tests/asistente/assistant-client-gate.test.mjs tests/asistente/assistant-bot2.test.mjs tests/asistente/assistant-worker.test.mjs

      - name: Install Cloudflare test dependencies
        if: steps.impact.outputs.level != 'visual'
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Production Worker dry-run
        if: steps.impact.outputs.level != 'visual'
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --dry-run --config ../cloudflare-prod/wrangler.jsonc

      - name: CANON business regressions
        if: steps.impact.outputs.level != 'visual'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/product-fixes/fix*/*.test.mjs
          node --test tests/product-fixes/canon-ticket-unified-editor.test.mjs
          node --test tests/product-fixes/sales-reports.test.mjs tests/product-fixes/review-fixes.test.mjs tests/cloud-sync/canonical-expense-revisions.test.mjs
          node --test tests/backup-complete.test.mjs tests/backup-restore.test.mjs

      - name: Cloud sync, offline outbox and idempotency regressions
        if: steps.impact.outputs.level != 'visual'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cloud-sync/*.test.mjs

      - name: Backend harness, backup manifest and SQL snapshot contracts
        if: steps.impact.outputs.level != 'visual'
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tools/cloudflare-lab/test/canon-backup-manifest.test.mjs \
            tools/cloudflare-lab/test/lab-workspace.test.mjs \
            tools/cloudflare-lab/test/turso-d1-adapter.test.mjs \
            tools/cloudflare-lab/test/d1-remote-compat.test.mjs
          python3 -m unittest tools/cloudflare-lab/test/test_lab_snapshot_from_sql.py

      - name: Apply all D1 migrations in isolated local database
        if: steps.impact.outputs.level != 'visual'
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 migrations apply nuevo-amanecer-lab --local

      - name: Tests must not modify tracked repository state
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

  e2e-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container: mcr.microsoft.com/playwright:v1.47.2-jammy
    steps:
      - name: Checkout with comparison history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node inside Playwright container
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund

      - name: Determine regression scope
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]] &&
             ! [[ "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" && git cat-file -e "$TARGET_SHA^{commit}"; then
            git diff --no-renames --name-only "$BASE_SHA" "$TARGET_SHA" > /tmp/na-changed-paths.txt
            node tools/ci/change-impact.mjs /tmp/na-changed-paths.txt | tee -a "$GITHUB_OUTPUT"
          else
            echo "level=critical" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Run targeted browser tests for ordinary changes
        if: steps.impact.outputs.level != 'critical'
        run: |
          npx playwright test --workers=4 \
            tests/e2e/work-default.spec.ts \
            tests/e2e/canon-mobile-home.spec.ts \
            tests/e2e/canon-mobile-clientes-caja.spec.ts \
            tests/e2e/canon-module-header-taps.spec.ts \
            tests/e2e/stock-negativo.spec.ts \
            tests/e2e/ticket-venta-pendiente.spec.ts

      - name: Run complete regression for critical commercial or pipeline changes
        if: steps.impact.outputs.level == 'critical'
        run: npx playwright test --workers=2

      - name: Upload Playwright report (on failures too)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish-web:
    needs: [validate, critical-regression, e2e-smoke]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/feature/v1.3-mobile-cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: nuevo-amanecer-production-change
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_WEB_URL: https://nuevo-amanecer-pos-web.nuevo-amanecer-pos.workers.dev
    steps:
      - name: Checkout exact CANON commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify deployed candidate is still CANON HEAD
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/v1.3-mobile-cloud
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"
          echo "POS_TARGET_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"

      - name: Setup Node for web publication
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify DIRECT web scope against the deployed SHA
        id: release_gate
        shell: bash
        run: node tools/release/web-release.mjs verify-direct

      - name: Require Cloudflare credentials
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'


      - name: Verify CANON experience contract
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            tests/product-fixes/canon-motion-bootstrap.test.mjs \
            tests/product-fixes/canon-lab-motion-lazy-bridge.test.mjs \
            tests/product-fixes/canonical-ui-contract.test.mjs

      - name: Install pinned Wrangler
        if: steps.release_gate.outputs.eligible == 'true'
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Assemble hosted POS
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/cloudflare-pos-web/_site
          mkdir -p tools/cloudflare-pos-web/_site/app
          cp -a POS/. tools/cloudflare-pos-web/_site/app/
          cp tools/cloudflare-pos-web/public/index.html tools/cloudflare-pos-web/_site/index.html
          cp tools/cloudflare-pos-web/public/activate.js tools/cloudflare-pos-web/_site/activate.js
          sed -i "s/__BUILD_HASH__/$POS_TARGET_SHA/g" tools/cloudflare-pos-web/_site/index.html
          sed -i "s/__BUILD_HASH__/$POS_TARGET_SHA/g" tools/cloudflare-pos-web/_site/app/sw.js
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sed -i "s/__BUILD_HASH__/$POS_TARGET_SHA/g; s/__BUILD_DATE__/$BUILD_DATE/g" tools/cloudflare-pos-web/_site/app/js/config/build-info.js
          if grep -Eq '__BUILD_HASH__|__BUILD_DATE__' tools/cloudflare-pos-web/_site/app/sw.js tools/cloudflare-pos-web/_site/index.html tools/cloudflare-pos-web/_site/app/js/config/build-info.js; then
            echo "Service Worker build hash placeholder was not replaced" >&2
            exit 1
          fi
          grep -Fq "$POS_TARGET_SHA" tools/cloudflare-pos-web/_site/app/sw.js
          grep -Fq "$POS_TARGET_SHA" tools/cloudflare-pos-web/_site/index.html

      - name: Hosted POS safety tests
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cloud-sync/v1.3-pos-web-deploy.test.mjs
          test -f tools/cloudflare-pos-web/_site/app/index.html
          test -f tools/cloudflare-pos-web/_site/app/js/sync/canonical-client.js
          test -f tools/cloudflare-pos-web/_site/app/js/sync/canonical-sale-integration.js
          test -f tools/cloudflare-pos-web/_site/app/js/sync/hosted-canonical-guard.js

      - name: Static Worker dry-run
        if: steps.release_gate.outputs.eligible == 'true'
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --dry-run --config ../cloudflare-pos-web/wrangler.jsonc

      - name: Record current Cloudflare deployment for recovery
        if: steps.release_gate.outputs.eligible == 'true'
        working-directory: tools/cloudflare-lab
        run: npx wrangler deployments list --config ../cloudflare-pos-web/wrangler.jsonc > /tmp/pos-web-before-deploy.txt

      - name: Preserve release and rollback evidence
        if: steps.release_gate.outputs.eligible == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pos-web-release-${{ github.event.workflow_run.head_sha || github.sha }}
          path: |
            /tmp/pos-web-before-deploy.txt
            /tmp/pos-auto-release.json
            ops/v1.3-pos-web-deploy-trigger.json
          retention-days: 30

      - name: Deploy hosted POS
        id: deploy_web
        if: steps.release_gate.outputs.eligible == 'true'
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/v1.3-mobile-cloud
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"
          npx wrangler deploy --config ../cloudflare-pos-web/wrangler.jsonc

      - name: Verify public launcher and POS assets
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            ROOT_CODE="$(curl -sS -D /tmp/pos-root.headers -o /tmp/pos-root.html -w '%{http_code}' --max-time 15 "$POS_WEB_URL/" || true)"
            APP_CODE="$(curl -sS -o /tmp/pos-app.html -w '%{http_code}' --max-time 15 "$POS_WEB_URL/app/" || true)"
            JS_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$POS_WEB_URL/app/js/sync/canonical-client.js" || true)"
            GUARD_CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$POS_WEB_URL/app/js/sync/hosted-canonical-guard.js" || true)"
            SW_CODE="$(curl -sS -o /tmp/pos-sw.js -w '%{http_code}' --max-time 15 "$POS_WEB_URL/app/sw.js" || true)"
            API_PROXY_CODE="$(curl -sS -o /tmp/pos-health.json -w '%{http_code}' --max-time 15 "$POS_WEB_URL/health" || true)"
            echo "probe attempt=$attempt root=$ROOT_CODE app=$APP_CODE canonical_client=$JS_CODE guard=$GUARD_CODE sw=$SW_CODE api_proxy=$API_PROXY_CODE"
            if test "$ROOT_CODE" = "200" &&
               test "$APP_CODE" = "200" &&
               test "$JS_CODE" = "200" &&
               test "$GUARD_CODE" = "200" &&
               test "$SW_CODE" = "200" &&
               test "$API_PROXY_CODE" = "200" &&
               grep -Fq 'Nuevo Amanecer POS' /tmp/pos-root.html &&
               grep -Fiq 'cache-control: no-store' /tmp/pos-root.headers &&
               grep -Fq 'Nuevo Amanecer — ERP &amp; POS' /tmp/pos-app.html &&
               grep -Fq '"ok":true' /tmp/pos-health.json &&
               grep -Fq "$POS_TARGET_SHA" /tmp/pos-sw.js; then
              echo "HOSTED_POS_WEB_PASS url=$POS_WEB_URL/"
              exit 0
            fi
            sleep 3
          done
          echo "Hosted POS public verification failed" >&2
          exit 1

      - name: Deployment summary
        if: steps.release_gate.outputs.eligible == 'true'
        shell: bash
        run: |
          {
            echo "## Nuevo Amanecer POS V1.3 — Hosted Web"
            echo "- Status: DEPLOYED"
            echo "- Public URL: $POS_WEB_URL/"
            echo "- App path: $POS_WEB_URL/app/"
            echo "- Local server required: NO"
            echo "- Activation secret embedded: NO"
            echo "- Backend CANON: nuevo-amanecer-pos-prod"
            echo "- Commit: $POS_TARGET_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revert published web when public verification fails
        if: ${{ failure() && steps.deploy_web.outcome == 'success' }}
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler rollback --message "AUTO-DEV revert: public verification failed" --config ../cloudflare-pos-web/wrangler.jsonc
          curl --fail --silent --show-error --max-time 15 "$POS_WEB_URL/health" >/tmp/pos-after-rollback-health.json
          grep -Fq '"ok":true' /tmp/pos-after-rollback-health.json
          echo "AUTO_DEV_ROLLBACK_PASS: previous web version restored; no business data modified"
