name: V1.3 CANON Debt UI Repair

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-canon-debt-ui-repair-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      TURSO_PROD_DATABASE_URL: ${{ secrets.TURSO_PROD_DATABASE_URL }}
      TURSO_PROD_AUTH_TOKEN: ${{ secrets.TURSO_PROD_AUTH_TOKEN }}
      PROD_API_URL: https://nuevo-amanecer-pos-prod.nuevo-amanecer-pos.workers.dev
      POS_WEB_URL: https://nuevo-amanecer-pos-web.nuevo-amanecer-pos.workers.dev
      EXPECTED_DEBT_CENTS: "2368495"
      EXPECTED_DEBT_CUSTOMERS: "29"

    steps:
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'
          test -n "$POS_ACTIVATION_SECRET"
          test -n "$TURSO_PROD_DATABASE_URL"
          test -n "$TURSO_PROD_AUTH_TOKEN"
          echo "::add-mask::$TURSO_PROD_DATABASE_URL"
          echo "::add-mask::$TURSO_PROD_AUTH_TOKEN"

      - name: Checkout exact authorized HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require exact branch and owner trigger
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"
          node - <<'NODE'
          const fs=require('node:fs');
          const t=JSON.parse(fs.readFileSync('ops/v1.3-canon-debt-ui-repair-trigger.json','utf8'));
          if(t.authorized!==true||t.authorized_by!=='owner')throw new Error('owner authorization missing');
          if(t.expected_total_cents!==2368495||t.expected_positive_customers!==29)throw new Error('debt invariant mismatch');
          NODE

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install pinned Wrangler and Turso adapter dependencies
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Prove production API exposes reconciled balances
        env:
          CANON_READ_ENDPOINT: ${{ env.PROD_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cloudflare-prod/scripts/verify-canonical-debt-readmodel.mjs
          node tools/cloudflare-prod/scripts/verify-canonical-debt-readmodel.mjs

      - name: Verify hosted UI contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test             tests/product-fixes/canonical-ui-contract.test.mjs             tests/product-fixes/canon-client-credit-index.test.mjs             tests/cloud-sync/v1.3-pos-web-deploy.test.mjs

      - name: Assemble fresh hosted POS shell
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tools/cloudflare-pos-web/_site
          mkdir -p tools/cloudflare-pos-web/_site/app
          cp -a POS/. tools/cloudflare-pos-web/_site/app/
          cp tools/cloudflare-pos-web/public/index.html tools/cloudflare-pos-web/_site/index.html
          cp tools/cloudflare-pos-web/public/activate.js tools/cloudflare-pos-web/_site/activate.js
          sed -i "s/__BUILD_HASH__/$GITHUB_SHA/g" tools/cloudflare-pos-web/_site/index.html
          sed -i "s/__BUILD_HASH__/$GITHUB_SHA/g" tools/cloudflare-pos-web/_site/app/sw.js
          grep -Fq "$GITHUB_SHA" tools/cloudflare-pos-web/_site/app/sw.js
          grep -Fq "$GITHUB_SHA" tools/cloudflare-pos-web/_site/index.html

      - name: Deploy fresh hosted CANON shell
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --config ../cloudflare-pos-web/wrangler.jsonc

      - name: Verify deployed build and same-origin CANON read model
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            SW_CODE="$(curl -sS -o /tmp/pos-sw.js -w '%{http_code}' --max-time 15 "$POS_WEB_URL/app/sw.js" || true)"
            HEALTH_CODE="$(curl -sS -o /tmp/pos-health.json -w '%{http_code}' --max-time 15 "$POS_WEB_URL/health" || true)"
            if test "$SW_CODE" = "200" && test "$HEALTH_CODE" = "200" &&
               grep -Fq "$GITHUB_SHA" /tmp/pos-sw.js &&
               grep -Fq '"ok":true' /tmp/pos-health.json; then
              break
            fi
            if test "$attempt" = "20"; then
              echo "hosted shell verification failed" >&2
              exit 1
            fi
            sleep 3
          done
          CANON_READ_ENDPOINT="$POS_WEB_URL" node tools/cloudflare-prod/scripts/verify-canonical-debt-readmodel.mjs

      - name: Summary
        shell: bash
        run: |
          {
            echo "## CANON debt UI repair"
            echo "- Production debt read model: PASS"
            echo "- Positive-debt customers: 29"
            echo "- Debt total: S/ 23,684.95"
            echo "- Hosted shell refreshed: YES"
            echo "- Same-origin read model: PASS"
            echo "- Build: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
