name: LAB Canon Mirror CI

on:
  pull_request:
    paths:
      - "tools/cloudflare-lab/**"
      - "laboratorio/pos-lab/**"
      - "tests/laboratorio-*.test.mjs"
      - "tests/security-secret-separation.test.mjs"
      - "tests/cloud-sync/session-architecture.test.mjs"
      - "docs/LAB_CANON_MIRROR.md"
      - ".github/workflows/lab-cloud-ci.yml"
      - "AGENTS.md"
      - ".agents/skills/**"
      - ".opencode/commands/lab-preflight.md"
      - ".opencode/agents/pos-lab-implementer.md"
  push:
    branches:
      - feature/v1.3-mobile-cloud
      - lab/credit-history-newest-first-v3-20261003
    paths:
      - "tools/cloudflare-lab/**"
      - "laboratorio/pos-lab/**"
      - "tests/laboratorio-*.test.mjs"
      - "tests/security-secret-separation.test.mjs"
      - "docs/LAB_CANON_MIRROR.md"
      - ".github/workflows/lab-cloud-ci.yml"
      - "AGENTS.md"
      - ".agents/skills/**"
      - ".opencode/commands/lab-preflight.md"
      - ".opencode/agents/pos-lab-implementer.md"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Universal LAB skill preflight gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          BASE_SHA="$PR_BASE_SHA"
          REQUIRE_ORDER=true
          if [ "$EVENT_NAME" != "pull_request" ]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
            REQUIRE_ORDER=false
          fi
          if [ -z "$BASE_SHA" ] || printf '%s' "$BASE_SHA" | grep -Eq '^0+$'; then
            BASE_SHA="$(git rev-parse HEAD^)"
          fi
          node laboratorio/pos-lab/skill-preflight.mjs --ci --base="$BASE_SHA" --require-order="$REQUIRE_ORDER"

      - name: Apply LAB credit-history ordering patch
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$BRANCH_NAME" != "lab/credit-history-newest-first-v3-20261003" ]; then
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('laboratorio/pos-lab/lab-overrides.js')
          text = path.read_text(encoding='utf-8')
          if 'function labSortCreditsNewestFirst(rows)' not in text:
              start = text.find('function labCategorySummary(client, category) {')
              if start < 0:
                  raise SystemExit('labCategorySummary start not found')
              end_marker = 'var closed = all.filter(labIsCanceled);'
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit('labCategorySummary closed line not found')
              end += len(end_marker)
              replacement = '\n'.join([
                  "function labCreditVisualDate(cr) {",
                  "    var direct = String(cr && cr.fecha || '').slice(0, 10);",
                  "    if (/^\\d{4}-\\d{2}-\\d{2}$/.test(direct)) return direct;",
                  "    var timestampDate = String(cr && cr.timestamp || '').slice(0, 10);",
                  "    return /^\\d{4}-\\d{2}-\\d{2}$/.test(timestampDate) ? timestampDate : '';",
                  "  }",
                  "",
                  "  function labCreditVisualTimestamp(cr) {",
                  "    var raw = String(cr && cr.timestamp || '');",
                  "    if (!/^\\d{4}-\\d{2}-\\d{2}T/.test(raw)) return Number.NEGATIVE_INFINITY;",
                  "    var parsed = Date.parse(raw);",
                  "    return Number.isFinite(parsed) ? parsed : Number.NEGATIVE_INFINITY;",
                  "  }",
                  "",
                  "  function labSortCreditsNewestFirst(rows) {",
                  "    return (Array.isArray(rows) ? rows : []).slice().sort(function (a, b) {",
                  "      var dateOrder = labCreditVisualDate(b).localeCompare(labCreditVisualDate(a));",
                  "      if (dateOrder) return dateOrder;",
                  "      var aTime = labCreditVisualTimestamp(a), bTime = labCreditVisualTimestamp(b);",
                  "      if (aTime !== bTime) return bTime - aTime;",
                  "      return String(b && (b.ventaId || b.id) || '').localeCompare(",
                  "        String(a && (a.ventaId || a.id) || ''), 'es', { numeric:true, sensitivity:'base' }",
                  "      );",
                  "    });",
                  "  }",
                  "",
                  "  function labCategorySummary(client, category) {",
                  "    var all = labCreditsForCategory(client.id, category.id);",
                  "    var active = labSortCreditsNewestFirst(all.filter(function (cr) { return !labIsCanceled(cr); }));",
                  "    var closed = labSortCreditsNewestFirst(all.filter(labIsCanceled));"
              ])
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          if git diff --quiet -- laboratorio/pos-lab/lab-overrides.js; then
            exit 0
          fi
          git config user.name "nuevo-amanecer-ci"
          git config user.email "actions@users.noreply.github.com"
          git add laboratorio/pos-lab/lab-overrides.js
          git commit -m "fix(lab): ordenar créditos más recientes primero"
          git push origin "HEAD:$BRANCH_NAME"

      - name: JavaScript syntax
        run: |
          node --check tools/cloudflare-lab/src/lab-workspace.js
          node --check tools/cloudflare-lab/src/turso-d1-adapter.js
          node --check tools/cloudflare-lab/src/database-binding.js
          node --check tools/cloudflare-lab/src/worker.js
          node --check laboratorio/pos-lab/js/lab-workspace.js
          node --check laboratorio/pos-lab/skill-preflight.mjs
          node --check laboratorio/pos-lab/scope-guard.mjs
          node --check laboratorio/pos-lab/lab-overrides.js

      - name: LAB unit tests
        run: |
          python3 -m unittest tools/cloudflare-lab/test/test_lab_snapshot_from_sql.py
          node --test tools/cloudflare-lab/test/canon-backup-manifest.test.mjs
          node --test tools/cloudflare-lab/test/lab-workspace.test.mjs
          node --test tools/cloudflare-lab/test/turso-d1-adapter.test.mjs
          node --test tools/cloudflare-lab/test/d1-remote-compat.test.mjs
          node --test tests/security-secret-separation.test.mjs
          node --test tests/cloud-sync/session-auth.test.mjs tests/cloud-sync/session-architecture.test.mjs
          node --test tests/laboratorio-skill-preflight.test.mjs tests/laboratorio-scope-guard.test.mjs
          node --test tests/laboratorio-pos-html.test.mjs tests/laboratorio-html-build.test.mjs tests/laboratorio-pages-current-head.test.mjs
          node --test tests/laboratorio-credit-history-newest-first.test.mjs
          node laboratorio/pos-lab/build-lab.mjs --check
          node laboratorio/check.mjs

      - name: Install Cloudflare lab dependencies
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Apply all D1 migrations locally
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 migrations apply nuevo-amanecer-lab --local
