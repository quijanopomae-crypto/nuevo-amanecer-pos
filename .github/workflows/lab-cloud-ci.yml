name: LAB Canon Mirror CI

on:
  pull_request:
    paths:
      - "tools/cloudflare-lab/**"
      - "laboratorio/pos-lab/**"
      - "tests/laboratorio-*.test.mjs"
      - "docs/LAB_CANON_MIRROR.md"
      - ".github/workflows/lab-cloud-ci.yml"
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "tools/cloudflare-lab/**"
      - "laboratorio/pos-lab/**"
      - "tests/laboratorio-*.test.mjs"
      - "docs/LAB_CANON_MIRROR.md"
      - ".github/workflows/lab-cloud-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          node --check tools/cloudflare-lab/src/lab-workspace.js
          node --check tools/cloudflare-lab/src/worker.js
          node --check laboratorio/pos-lab/js/lab-workspace.js

      - name: LAB unit tests
        run: |
          python3 -m unittest tools/cloudflare-lab/test/test_lab_snapshot_from_sql.py
          node --test tools/cloudflare-lab/test/canon-backup-manifest.test.mjs
          node --test tools/cloudflare-lab/test/lab-workspace.test.mjs
          node --test tools/cloudflare-lab/test/d1-remote-compat.test.mjs
          node --test tests/laboratorio-pos-html.test.mjs tests/laboratorio-html-build.test.mjs
          node laboratorio/pos-lab/build-lab.mjs --check
          node laboratorio/check.mjs

      - name: Install Cloudflare lab dependencies
        working-directory: tools/cloudflare-lab
        run: npm ci

      - name: Apply all D1 migrations locally
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 migrations apply nuevo-amanecer-lab --local
