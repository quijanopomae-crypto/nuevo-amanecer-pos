name: V1.3 Hosted Auth E2E Probe

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-hosted-auth-probe-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb
      PROD_WORKER_URL: https://nuevo-amanecer-pos-web.nuevo-amanecer-pos.workers.dev

    steps:
      - name: Require probe credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POS_ACTIVATION_SECRET"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Probe hosted activation session and canonical reads
        shell: bash
        run: |
          set -euo pipefail
          node tools/cloudflare-prod/scripts/cutover-prepare.mjs probe-worker
          echo "HOSTED_AUTH_E2E_PASS"
