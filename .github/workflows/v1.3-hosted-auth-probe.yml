name: V1.3 Hosted Auth E2E Probe

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-hosted-auth-probe-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb
      HOSTED_URL: https://nuevo-amanecer-pos-web.nuevo-amanecer-pos.workers.dev

    steps:
      - name: Require probe credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POS_ACTIVATION_SECRET"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"

      - name: Probe exact hosted auth stages
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const base = process.env.HOSTED_URL;
          const secret = process.env.POS_ACTIVATION_SECRET;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const db = process.env.PROD_DATABASE_ID;
          let sessionToken = '';
          let tokenHash = '';

          async function cfQuery(sql, params=[]) {
            const r = await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query', {
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({sql,params})
            });
            const x=await r.json().catch(()=>null);
            if(!r.ok || x?.success!==true) {
              const detail=(x?.errors||[]).map(e=>String(e?.message||'')).filter(Boolean).join(';') || 'unknown';
              throw new Error('d1_query_failed_'+r.status+'_'+detail);
            }
            const result=Array.isArray(x.result)?x.result[0]:x.result;
            if(!result || result.success===false) {
              const detail=(result?.error || 'result_failure');
              throw new Error('d1_result_failed_'+detail);
            }
            return result?.results||[];
          }

          async function cleanup() {
            if(!tokenHash) return;
            try {
              const rows=await cfQuery('SELECT session_id FROM auth_sessions WHERE token_hash=?1',[tokenHash]);
              for(const row of rows){
                const id=String(row.session_id||'');
                if(!id) continue;
                await cfQuery('DELETE FROM auth_sessions WHERE session_id=?1',[id]);
                await cfQuery('DELETE FROM devices WHERE device_id=?1',['session:'+id]);
              }
              console.log('cleanup=PASS sessions='+rows.length);
            } catch(e) {
              console.log('cleanup=FAIL error='+String(e.message||e));
            }
          }

          function safeBody(body){
            if(!body || typeof body!=='object') return {};
            const out={};
            for(const k of ['error','status','session_id','authority','mode','promotion_id','authority_epoch','revision','financial_revision']) {
              if(body[k]!==undefined) out[k]=body[k];
            }
            return out;
          }

          (async()=>{
            try {
              const a=await fetch(base+'/auth/activate',{method:'POST',headers:{'x-activation-secret':secret}});
              const ab=await a.json().catch(()=>({}));
              console.log('stage=activate http='+a.status+' body='+JSON.stringify(safeBody(ab)));
              if(!a.ok || typeof ab.session_token!=='string' || !ab.session_token) process.exitCode=11;
              else {
                sessionToken=ab.session_token;
                tokenHash=createHash('sha256').update(sessionToken).digest('hex');

                const s=await fetch(base+'/auth/session',{headers:{authorization:'Bearer '+sessionToken}});
                const sb=await s.json().catch(()=>({}));
                console.log('stage=session http='+s.status+' body='+JSON.stringify(safeBody(sb)));
                if(!s.ok) {
                  try {
                    const cols1=await cfQuery("PRAGMA table_info('auth_sessions')");
                    const cols2=await cfQuery("PRAGMA table_info('devices')");
                    console.log('diag=auth_sessions_columns '+cols1.map(x=>x.name).join(','));
                    console.log('diag=devices_columns '+cols2.map(x=>x.name).join(','));
                    const exact=await cfQuery(
                      "SELECT s.session_id,s.status AS session_status,d.device_id,d.role,d.status AS principal_status,d.credential_hash FROM auth_sessions s JOIN devices d ON d.device_id='session:' || s.session_id WHERE s.token_hash=?1",
                      [tokenHash]
                    );
                    console.log('diag=exact_session_join rows='+exact.length);
                    const sessionOnly=await cfQuery(
                      "SELECT session_id,status FROM auth_sessions WHERE token_hash=?1",
                      [tokenHash]
                    );
                    console.log('diag=session_only rows='+sessionOnly.length);
                  } catch(e) {
                    console.log('diag=d1_error '+String(e.message||e));
                  }
                  process.exitCode=12;
                }
                else {
                  const c=await fetch(base+'/read/canonical/status',{headers:{authorization:'Bearer '+sessionToken}});
                  const cb=await c.json().catch(()=>({}));
                  console.log('stage=canonical-status http='+c.status+' body='+JSON.stringify(safeBody(cb)));
                  if(!c.ok) process.exitCode=13;
                  else {
                    for(const path of ['/read/canonical/products?limit=1','/read/canonical/customers?limit=1']){
                      const rr=await fetch(base+path,{headers:{authorization:'Bearer '+sessionToken}});
                      const rb=await rr.json().catch(()=>({}));
                      console.log('stage='+path+' http='+rr.status+' error='+(rb?.error||'none'));
                      if(!rr.ok) process.exitCode=14;
                    }
                  }
                }
              }
            } finally {
              await cleanup();
            }
          })().catch(async e=>{console.log('probe_exception='+String(e.message||e)); await cleanup(); process.exitCode=20;});
          NODE
