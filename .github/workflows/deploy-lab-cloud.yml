name: Desplegar LAB Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-lab:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_CANON_READ_TOKEN: ${{ secrets.R2_CANON_READ_TOKEN }}
      LAB_IMPORT_HMAC_SECRET: ${{ secrets.LAB_IMPORT_HMAC_SECRET }}

    steps:
      - name: Require LAB deployment secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_CANON_READ_TOKEN"
          test -n "$LAB_IMPORT_HMAC_SECRET"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Require current active branch head
        run: |
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"

      - name: Install dependencies
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Validate before remote changes
        run: |
          node --check tools/cloudflare-lab/src/lab-workspace.js
          node --check tools/cloudflare-lab/src/worker.js
          node --check laboratorio/pos-lab/js/lab-workspace.js
          python3 -m unittest tools/cloudflare-lab/test/test_lab_snapshot_from_sql.py
          node --test tools/cloudflare-lab/test/canon-backup-manifest.test.mjs
          node --test tools/cloudflare-lab/test/lab-workspace.test.mjs
          node --test tools/cloudflare-lab/test/d1-remote-compat.test.mjs
          node --test tests/laboratorio-*.test.mjs
          node --test tests/security-secret-separation.test.mjs
          node laboratorio/pos-lab/build-lab.mjs --check
          node laboratorio/check.mjs

      - name: Preflight latest CANON backup before remote changes
        working-directory: tools/cloudflare-lab
        run: |
          node scripts/fetch-latest-canon-backup.mjs
          python3 scripts/lab-snapshot-from-sql.py --sql /tmp/canon.sql --output /tmp/lab-snapshot.json

      - name: Apply D1 LAB migrations
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 migrations apply nuevo-amanecer-lab --remote

      - name: Deploy LAB Worker before secret binding
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy

      - name: Configure dedicated LAB import HMAC secret
        working-directory: tools/cloudflare-lab
        run: printf '%s' "$LAB_IMPORT_HMAC_SECRET" | npx wrangler secret put LAB_IMPORT_HMAC_SECRET

      - name: Verify import HMAC secret binding exists
        working-directory: tools/cloudflare-lab
        run: |
          npx wrangler secret list | grep -F '"name": "LAB_IMPORT_HMAC_SECRET"'

      - name: Verify LAB Worker health
        run: curl --fail --silent --show-error https://nuevo-amanecer-sync-lab.nuevo-amanecer-pos.workers.dev/health

      - name: Publish prevalidated CANON baseline into D1 LAB workspace
        working-directory: tools/cloudflare-lab
        run: node scripts/publish-lab-snapshot.mjs
