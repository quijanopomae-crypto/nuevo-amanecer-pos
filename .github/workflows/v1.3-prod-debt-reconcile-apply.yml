name: V1.3 Production Debt Reconciliation Apply

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-prod-debt-reconcile-apply-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb
      PROD_DATABASE_NAME: nuevo-amanecer-prod-v2
      R2_BUCKET: nuevo-amanecer-prod-v2-backups
      PROD_WORKER_URL: https://nuevo-amanecer-pos-prod.nuevo-amanecer-pos.workers.dev

    steps:
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POS_ACTIVATION_SECRET"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout exact authorized HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require exact active branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate reconciliation code and focused contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cloudflare-prod/scripts/debt-reconcile-apply.mjs
          node --check tools/cloudflare-prod/scripts/owner-validation-readonly.mjs
          node --check tools/cloudflare-lab/src/a6-canonical.js
          node --test             tests/cloud-sync/canonical-debt-reconciliation.test.mjs             tests/cloud-sync/v1.3-owner-validation-readonly.test.mjs

      - name: Install pinned Cloudflare tooling
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Production Worker dry-run
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --dry-run --config ../cloudflare-prod/wrangler.jsonc

      - name: Verify CANON is ACTIVE before backup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          async function query(sql,params=[]){
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database+'/query',{
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({sql,params})
            });
            const body=await response.json().catch(()=>null);
            if(!response.ok||body?.success!==true)throw new Error('D1 preflight failed');
            const first=Array.isArray(body.result)?body.result[0]:body.result;
            if(!first||first.success===false)throw new Error('D1 preflight query failed');
            return first.results||[];
          }
          (async()=>{
            const control=(await query("SELECT mode,active_promotion_id FROM canonical_control WHERE id=1"))[0];
            if(!control||control.mode!=='ACTIVE'||!control.active_promotion_id)throw new Error('CANON is not ACTIVE');
            const partial=(await query("SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name IN ('canonical_reconciliation_credits','canonical_credit_baseline_adjustments')"))[0];
            if(![0,2].includes(Number(partial?.n)))throw new Error('partial reconciliation schema detected');
            console.log(JSON.stringify({state:'DEBT_RECONCILE_PREFLIGHT_PASS',schema_tables:Number(partial?.n)}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Export fresh production backup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {writeFileSync}=require('node:fs');
          const {createHash}=require('node:crypto');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database+'/export';
          const headers={authorization:'Bearer '+token,'content-type':'application/json'};
          async function api(body){
            const response=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
            const parsed=await response.json().catch(()=>null);
            if(!response.ok||parsed?.success!==true||!parsed.result)throw new Error('D1 export API failed');
            if(parsed.result.status==='error')throw new Error('D1 export job failed');
            return parsed.result;
          }
          (async()=>{
            const start=await api({output_format:'polling'});
            if(!start.at_bookmark)throw new Error('missing backup bookmark');
            let complete=null;
            for(let attempt=0;attempt<60;attempt++){
              const result=await api({output_format:'polling',current_bookmark:start.at_bookmark});
              if(result.status==='complete'&&result.result?.signed_url){complete=result;break;}
              await new Promise(resolve=>setTimeout(resolve,2000));
            }
            if(!complete)throw new Error('D1 export did not complete');
            const download=await fetch(complete.result.signed_url);
            if(!download.ok)throw new Error('backup download failed');
            const bytes=Buffer.from(await download.arrayBuffer());
            if(!bytes.length||bytes.length>32*1024*1024)throw new Error('backup size invalid');
            const sha256=createHash('sha256').update(bytes).digest('hex');
            writeFileSync('/tmp/debt-reconcile-backup.sql',bytes);
            writeFileSync('/tmp/debt-reconcile-backup.json',JSON.stringify({bookmark:start.at_bookmark,size_bytes:bytes.length,sha256},null,2));
            console.log(JSON.stringify({state:'DEBT_RECONCILE_BACKUP_READY',size_bytes:bytes.length,sha256}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Store backup in private R2
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          KEY="v1.3-debt-reconcile/$(date -u +%Y-%m-%dT%H-%M-%SZ)-$GITHUB_SHA.sql"
          npx wrangler r2 object put "$R2_BUCKET/$KEY" --file=/tmp/debt-reconcile-backup.sql
          npx wrangler r2 object get "$R2_BUCKET/$KEY" --file=/tmp/debt-reconcile-backup-check.sql
          test "$(sha256sum /tmp/debt-reconcile-backup.sql | awk '{print $1}')" = "$(sha256sum /tmp/debt-reconcile-backup-check.sql | awk '{print $1}')"
          echo "DEBT_RECONCILE_BACKUP_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Detect reconciliation schema
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {appendFileSync}=require('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          (async()=>{
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database+'/query',{
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({sql:"SELECT COUNT(*) AS n FROM sqlite_master WHERE type='table' AND name IN ('canonical_reconciliation_credits','canonical_credit_baseline_adjustments')"})
            });
            const body=await response.json().catch(()=>null);
            if(!response.ok||body?.success!==true)throw new Error('schema detection failed');
            const first=Array.isArray(body.result)?body.result[0]:body.result;
            const n=Number(first?.results?.[0]?.n);
            if(![0,2].includes(n))throw new Error('partial reconciliation schema');
            appendFileSync(process.env.GITHUB_ENV,'HAS_DEBT_RECONCILIATION='+(n===2?'1':'0')+'\n');
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Apply migration 0019 if missing
        if: ${{ env.HAS_DEBT_RECONCILIATION == '0' }}
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 execute "$PROD_DATABASE_NAME" --remote --file=../../infra/database/migrations/0019_canonical_debt_reconciliation.sql

      - name: Verify migration 0019
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          (async()=>{
            const sql="SELECT "+
              "(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='canonical_reconciliation_credits') recon_table,"+
              "(SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='canonical_credit_baseline_adjustments') adjust_table,"+
              "(SELECT COUNT(*) FROM sqlite_master WHERE type='view' AND name='canonical_credit_balances') balance_view,"+
              "(SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='financial_event_credit_safe') credit_guard";
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+database+'/query',{
              method:'POST',
              headers:{authorization:'Bearer '+token,'content-type':'application/json'},
              body:JSON.stringify({sql})
            });
            const body=await response.json().catch(()=>null);
            if(!response.ok||body?.success!==true)throw new Error('migration verification failed');
            const first=Array.isArray(body.result)?body.result[0]:body.result;
            const row=first?.results?.[0];
            if(!row||Number(row.recon_table)!==1||Number(row.adjust_table)!==1||Number(row.balance_view)!==1||Number(row.credit_guard)!==1)throw new Error('migration 0019 incomplete');
            console.log(JSON.stringify({state:'MIGRATION_0019_PASS'}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Deploy production Worker with reconciliation read model
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --config ../cloudflare-prod/wrangler.jsonc

      - name: Probe production Worker
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            BODY="$(curl -sS --max-time 15 "$PROD_WORKER_URL/health" || true)"
            if printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.ok===true&&x.service==="nuevo-amanecer-pos-prod"?0:1)}catch{process.exit(1)}})'; then
              echo "PRODUCTION_WORKER_HEALTH_PASS"
              exit 0
            fi
            sleep 3
          done
          echo "Production Worker health failed" >&2
          exit 1

      - name: Apply encrypted 29-customer debt reconciliation
        run: node tools/cloudflare-prod/scripts/debt-reconcile-apply.mjs

      - name: Validate CANON read model after reconciliation
        run: node tools/cloudflare-prod/scripts/owner-validation-readonly.mjs

      - name: Summary
        shell: bash
        run: |
          {
            echo "## CANON debt reconciliation"
            echo "- Status: APPLIED_AND_VERIFIED"
            echo "- Target customers: 29"
            echo "- Target debt: S/ 23,684.95"
            echo "- Backup: $DEBT_RECONCILE_BACKUP_KEY"
            echo "- Payment/cash/sales ledgers: preserved"
            echo "- Worker read model: verified"
          } >> "$GITHUB_STEP_SUMMARY"
