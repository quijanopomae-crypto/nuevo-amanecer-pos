name: CANON Desktop Dashboard Wire

on:
  push:
    branches:
      - fix/canon-desktop-tablet-dashboard-20261003
    paths:
      - ".github/workflows/canon-desktop-dashboard-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/canon-desktop-tablet-dashboard-20261003
          fetch-depth: 1

      - name: Wire stylesheet into shell and precache
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          index = Path('POS/index.html')
          html = index.read_text(encoding='utf-8')
          link = '    <link rel="stylesheet" href="css/canon-desktop-dashboard.css">\n'
          if 'css/canon-desktop-dashboard.css' not in html:
              marker = '    <link rel="stylesheet" href="css/experience-v2/animations/notifications.css">\n'
              if html.count(marker) != 1:
                  raise SystemExit('stylesheet insertion marker not unique')
              html = html.replace(marker, marker + link, 1)
          index.write_text(html, encoding='utf-8')

          sw = Path('POS/sw.js')
          source = sw.read_text(encoding='utf-8')
          asset = "  './css/canon-desktop-dashboard.css',\n"
          if './css/canon-desktop-dashboard.css' not in source:
              marker = "  './css/client-credit-accounts-v2.css',\n"
              if source.count(marker) != 1:
                  raise SystemExit('service worker insertion marker not unique')
              source = source.replace(marker, marker + asset, 1)
          sw.write_text(source, encoding='utf-8')
          PY

      - name: Verify parity and focused regression
        shell: bash
        run: |
          set -euo pipefail
          node tools/pos-experience/promote-lab-visuals.mjs --check
          node --check POS/js/legacy-inline/inline-02.js
          node --test tests/product-fixes/fix-desktop-tablet-dashboard/canon-desktop-tablet-dashboard.test.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' POS/index.html POS/sw.js | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS/index.html POS/sw.js
          git commit -m "ui(canon): cablear dashboard de escritorio al shell PWA"
          git push origin HEAD:fix/canon-desktop-tablet-dashboard-20261003
