name: CANON Desktop Dashboard Wire

on:
  push:
    branches:
      - fix/canon-desktop-tablet-dashboard-20261003
    paths:
      - ".github/workflows/canon-desktop-dashboard-wire.yml"

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/canon-desktop-tablet-dashboard-20261003
          fetch-depth: 1

      - name: Restore shared shell and wire CANON decorator
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 36459852b6be86525b7a9751561969cb6af8ddd4 --depth=1
          git show 36459852b6be86525b7a9751561969cb6af8ddd4:POS/js/legacy-inline/inline-02.js > POS/js/legacy-inline/inline-02.js
          python3 - <<'PY'
          from pathlib import Path

          index = Path('POS/index.html')
          html = index.read_text(encoding='utf-8')
          lab_menu = Path('laboratorio/pos-lab/sections/menu.html').read_text(encoding='utf-8').rstrip('\n')
          config_card = '            <div class="module-card" style="--accent:#64748b;--icon-bg:#f8fafc" onclick="goPage(\'pageConfig\')"><div class="module-icon">⚙️</div><div class="module-label">Configuración</div><div class="module-desc">Personaliza productos, ticket y el sistema.</div><div class="module-arrow">Entrar →</div></div>'
          if config_card not in lab_menu:
              raise SystemExit('protected LAB config card not found')
          canon_menu = lab_menu.replace(config_card + '\n', '', 1).replace(config_card, '', 1).rstrip()

          start_marker = '<div class="page active" id="pageMenu">'
          end_marker = '\n<!-- POS -->'
          start = html.find(start_marker)
          end = html.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('CANON menu section markers missing')
          html = html[:start] + canon_menu + '\n' + html[end:]

          css_link = '    <link rel="stylesheet" href="css/canon-desktop-dashboard.css">\n'
          if 'css/canon-desktop-dashboard.css' not in html:
              css_marker = '    <link rel="stylesheet" href="css/experience-v2/animations/notifications.css">\n'
              if html.count(css_marker) != 1:
                  raise SystemExit('CSS marker not unique')
              html = html.replace(css_marker, css_marker + css_link, 1)

          js_tag = '<script src="js/canon-desktop-dashboard.js"></script>\n'
          if 'js/canon-desktop-dashboard.js' not in html:
              js_marker = '<script src="js/canon-pos-reference-ui.js"></script>\n'
              if html.count(js_marker) != 1:
                  raise SystemExit('JS marker not unique')
              html = html.replace(js_marker, js_marker + js_tag, 1)
          index.write_text(html, encoding='utf-8')

          sw = Path('POS/sw.js')
          source = sw.read_text(encoding='utf-8')
          if './css/canon-desktop-dashboard.css' not in source:
              css_marker = "  './css/client-credit-accounts-v2.css',\n"
              if source.count(css_marker) != 1:
                  raise SystemExit('SW CSS marker not unique')
              source = source.replace(css_marker, css_marker + "  './css/canon-desktop-dashboard.css',\n", 1)
          if './js/canon-desktop-dashboard.js' not in source:
              js_marker = "  './js/canon-pos-reference-ui.js',\n"
              if source.count(js_marker) != 1:
                  raise SystemExit('SW JS marker not unique')
              source = source.replace(js_marker, js_marker + "  './js/canon-desktop-dashboard.js',\n", 1)
          sw.write_text(source, encoding='utf-8')
          PY

      - name: Verify parity and dashboard regression
        shell: bash
        run: |
          set -euo pipefail
          node tools/pos-experience/promote-lab-visuals.mjs --check
          node --test tests/product-fixes/lab-canon-promotion-parity.test.mjs
          node --check POS/js/canon-desktop-dashboard.js
          node --check POS/js/legacy-inline/inline-02.js
          node --test tests/product-fixes/fix-desktop-tablet-dashboard/canon-desktop-tablet-dashboard.test.mjs
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' POS/index.html POS/js/legacy-inline/inline-02.js POS/sw.js | sort)"
          test "$changed" = "$expected"

      - name: Commit bounded wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS/index.html POS/js/legacy-inline/inline-02.js POS/sw.js
          git commit -m "ui(canon): aislar dashboard en decorador runtime"
          git push origin HEAD:fix/canon-desktop-tablet-dashboard-20261003
