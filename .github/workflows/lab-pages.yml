name: POS LAB Mobile

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "laboratorio/pos-lab/**"
      - "tests/laboratorio-*.test.mjs"
  workflow_run:
    workflows:
      - "CANON Critical CI"
    types:
      - completed
    branches:
      - feature/v1.3-mobile-cloud
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-pos-lab
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    env:
      LAB_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact LAB build source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ env.LAB_BUILD_SHA }}

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate generated LAB
        run: |
          node laboratorio/pos-lab/build-lab.mjs --check
          node --test tests/laboratorio-*.test.mjs

      - name: Prepare and verify static LAB site
        run: |
          mkdir -p _site/POS _site/laboratorio/pos-lab
          cp -a POS/. _site/POS/
          cp -a laboratorio/pos-lab/. _site/laboratorio/pos-lab/

          cat > _site/POS/index.html <<'EOF'
          <!doctype html>
          <html lang="es">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex,nofollow">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>Nuevo Amanecer — LAB support assets only</title>
          </head>
          <body>
            <p>This Pages path contains support assets for POS-LAB only. The canonical POS is not served from GitHub Pages.</p>
            <p><a href="../laboratorio/pos-lab/index.html">Open POS-LAB</a></p>
          </body>
          </html>
          EOF

          touch _site/.nojekyll

          node laboratorio/pos-lab/verify-pages-site.mjs \
            --site _site \
            --build "$LAB_BUILD_SHA" \
            --stamp

          grep -Fq "name=\"na-lab-build\" content=\"$LAB_BUILD_SHA\"" _site/laboratorio/pos-lab/index.html
          grep -Fq "build=$LAB_BUILD_SHA" _site/laboratorio/pos-lab/index.html

          test -f _site/POS/js/adapters/canonical-ui-adapter.js
          test -f _site/POS/js/motion/scroll-motion.js
          grep -Fq "NuevoAmanecerCanonicalUIAdapter" _site/POS/js/adapters/canonical-ui-adapter.js
          grep -Fq "enablePreset: function" _site/POS/js/motion/scroll-motion.js

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Verify public LAB matches this exact commit
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}/"
          LAB_URL="${BASE}laboratorio/pos-lab/index.html?verify=${BUILD_SHA}"

          curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors \
            -H 'Cache-Control: no-cache' \
            "$LAB_URL" -o /tmp/lab-index.html

          grep -Fq "name=\"na-lab-build\" content=\"${BUILD_SHA}\"" /tmp/lab-index.html
          grep -Fq "build=${BUILD_SHA}" /tmp/lab-index.html

          verify_asset() {
            local path="$1"
            local marker="$2"
            local out="/tmp/asset-$(echo "$path" | tr '/.' '__')"
            curl -fsSL --retry 10 --retry-delay 2 --retry-all-errors \
              -H 'Cache-Control: no-cache' \
              "${BASE}${path}?build=${BUILD_SHA}" -o "$out"
            grep -Fq "$marker" "$out"
          }

          verify_asset "POS/js/adapters/canonical-ui-adapter.js" "NuevoAmanecerCanonicalUIAdapter"
          verify_asset "POS/js/motion/scroll-motion.js" "enablePreset: function"
          verify_asset "laboratorio/pos-lab/styles/pages/menu.css" "hero-welcome-only"
          verify_asset "laboratorio/pos-lab/lab-guard.js" "__NA_LAB__"

          echo "LAB_PUBLIC_VERIFY_PASS sha=${BUILD_SHA} url=${LAB_URL}"
