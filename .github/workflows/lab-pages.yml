name: POS LAB Mobile

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "laboratorio/pos-lab/**"
      - "tests/laboratorio-*.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-pos-lab
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate generated LAB
        run: |
          node laboratorio/pos-lab/build-lab.mjs --check
          node --test tests/laboratorio-*.test.mjs

      - name: Prepare static LAB site
        run: |
          mkdir -p _site/POS _site/laboratorio/pos-lab
          cp -a POS/. _site/POS/
          cp -a laboratorio/pos-lab/. _site/laboratorio/pos-lab/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
