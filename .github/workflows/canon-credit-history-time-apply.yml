name: CANON Credit History Time Apply

on:
  push:
    branches:
      - fix/canon-credit-time-20261003
    paths:
      - ".github/workflows/canon-credit-history-time-apply.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/canon-credit-time-20261003
          fetch-depth: 1

      - name: Require exact scoped branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "fix/canon-credit-time-20261003"

      - name: Apply bounded visual patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('POS/js/modules/client-credit-accounts-v2.js')
          text = path.read_text(encoding='utf-8')

          marker = "  function labPurchaseRow(cr) {\n"
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one labPurchaseRow marker')

          helper = textwrap.dedent("""\
            function labCreditDisplayTime(cr) {
              function direct(value) {
                var raw = String(value || '').trim();
                if (!raw) return '';
                var compact = raw.toLowerCase().replace(/[.\\s]/g, '');
                var match = /^(\\d{1,2}):(\\d{2})(?::\\d{2})?(am|pm)?$/.exec(compact);
                if (!match) return '';
                var hour = Number(match[1]), minute = Number(match[2]), suffix = match[3] || '';
                if (!Number.isInteger(hour) || !Number.isInteger(minute) || minute < 0 || minute > 59) return '';
                if (suffix) {
                  if (hour < 1 || hour > 12) return '';
                  if (suffix === 'pm' && hour < 12) hour += 12;
                  if (suffix === 'am' && hour === 12) hour = 0;
                } else if (hour < 0 || hour > 23) return '';
                return String(hour).padStart(2, '0') + ':' + String(minute).padStart(2, '0');
              }

              var exact = direct(cr && cr.hora24) || direct(cr && cr.hora);
              if (exact) return exact;

              var timestamp = String(cr && cr.timestamp || '').trim();
              if (!/[T ]\\d{2}:\\d{2}/.test(timestamp)) return '';
              var parsed = new Date(timestamp);
              if (Number.isFinite(parsed.getTime())) {
                return String(parsed.getHours()).padStart(2, '0') + ':' + String(parsed.getMinutes()).padStart(2, '0');
              }
              var fallback = /[T ](\\d{2}):(\\d{2})/.exec(timestamp);
              return fallback ? fallback[1] + ':' + fallback[2] : '';
            }

            function labCreditDisplayMoment(cr, fallbackDate) {
              var date = labCreditVisualDate(cr) || String(fallbackDate || '');
              var time = labCreditDisplayTime(cr);
              return date + (date && time ? ' · ' + time : '');
            }

          """)
          text = text.replace(marker, helper + marker, 1)

          old_row = "labEsc(cr.fecha || 'Fecha no registrada')"
          new_row = "labEsc(labCreditDisplayMoment(cr, 'Fecha no registrada'))"
          if text.count(old_row) != 1:
              raise SystemExit('Expected exactly one purchase-row date expression')
          text = text.replace(old_row, new_row, 1)

          old_header = "labEsc(cr.fecha || '')"
          new_header = "labEsc(labCreditDisplayMoment(cr, ''))"
          if text.count(old_header) != 1:
              raise SystemExit('Expected exactly one purchase-detail date expression')
          text = text.replace(old_header, new_header, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify syntax and focal regression
        shell: bash
        run: |
          set -euo pipefail
          node --check POS/js/modules/client-credit-accounts-v2.js
          node --test tests/product-fixes/fix-credit-history-time/canon-credit-history-time.test.mjs
          test "$(git diff --name-only)" = "POS/js/modules/client-credit-accounts-v2.js"

      - name: Commit bounded CANON patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add POS/js/modules/client-credit-accounts-v2.js
          git commit -m "fix(canon): mostrar hora y minuto en créditos pequeños"
          git push origin HEAD:fix/canon-credit-time-20261003
