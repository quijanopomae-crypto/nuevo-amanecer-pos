name: OpenCode Role Map CI

on:
  pull_request:
    paths:
      - ".opencode/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "AGENTS_Nuevo_Amanecer.md"
      - "MANIFEST.yaml"
      - "opencode.json"
      - "tests/opencode-role-map.test.mjs"
      - ".github/workflows/opencode-config-ci.yml"
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - ".opencode/**"
      - ".agents/skills/**"
      - "AGENTS.md"
      - "AGENTS_Nuevo_Amanecer.md"
      - "MANIFEST.yaml"
      - "opencode.json"
      - "tests/opencode-role-map.test.mjs"
      - ".github/workflows/opencode-config-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Role and command boundaries
        run: node --test tests/opencode-role-map.test.mjs tests/repo-map.test.mjs

      - name: Python validator syntax
        run: python -m py_compile orchestrator/project_validation.py orchestrator/snapshot.py tests/infrastructure/test_shadow_mode.py

      - name: Working tree remains clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
