name: V1.3 Production Product Images Batch

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-prod-product-images-trigger.json"

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb
      PROD_DATABASE_NAME: nuevo-amanecer-prod-v2
      R2_BUCKET: nuevo-amanecer-prod-v2-backups
      PROD_WORKER_URL: https://nuevo-amanecer-pos-prod.nuevo-amanecer-pos.workers.dev
      PRODUCT_IMAGE_BATCH_PATH: ops/product-images/batch-001.json
      PRODUCT_IMAGE_PREPARED_PATH: /tmp/product-image-batch-001-prepared.json
      PRODUCT_IMAGE_TRIGGER_PATH: ops/v1.3-prod-product-images-trigger.json

    steps:
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POS_ACTIVATION_SECRET"
          test "${#POS_ACTIVATION_SECRET}" -ge 12
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout exact authorized HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Require trigger-only authorization commit
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=2
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"
          test "$(git diff --name-only HEAD^ HEAD)" = "$PRODUCT_IMAGE_TRIGGER_PATH"
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const p=process.env.PRODUCT_IMAGE_TRIGGER_PATH;
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          const parent=cp.execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim();
          if(x?.schema!=='nuevo-amanecer.prod-product-images-trigger/v1') throw new Error('invalid trigger schema');
          if(x?.batch_id!=='001') throw new Error('invalid batch id');
          if(x?.authorized_by_owner!==true) throw new Error('owner authorization missing');
          if(x?.confirmation!=='APPLY_CANON_PRODUCT_IMAGES_BATCH_001') throw new Error('confirmation mismatch');
          if(x?.expected_base_head!==parent) throw new Error('trigger parent does not match authorized implementation head');
          console.log(JSON.stringify({state:'PRODUCT_IMAGE_TRIGGER_AUTHORIZED',batch_id:x.batch_id,parent}));
          NODE

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Validate image contracts and regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --check tools/cloudflare-prod/scripts/product-image-batch-apply.mjs
          node --check tools/cloudflare-prod/scripts/product-image-batch-verify-worker.mjs
          node --test \
            tests/cloud-sync/canonical-product-images.test.mjs \
            tests/cloud-sync/canonical-product-image-batch-script.test.mjs \
            tests/cloud-sync/canonical-inventory-adjust.test.mjs \
            tests/cloud-sync/canonical-live-products.test.mjs

      - name: Install pinned Cloudflare tooling
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Prepare all 10 approved images before production writes
        shell: bash
        run: node tools/cloudflare-prod/scripts/product-image-batch-apply.mjs prepare

      - name: Preflight ACTIVE CANON and exact 10 product names
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const manifest=JSON.parse(fs.readFileSync(process.env.PRODUCT_IMAGE_BATCH_PATH,'utf8'));
          async function query(sql,params=[]){
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`,{
              method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({sql,params})
            });
            const body=await response.json().catch(()=>null);
            if(!response.ok||body?.success!==true)throw new Error(`D1 preflight failed ${response.status}`);
            const first=Array.isArray(body.result)?body.result[0]:body.result;
            if(!first||first.success===false)throw new Error('D1 preflight query failed');
            return first.results||[];
          }
          (async()=>{
            const control=(await query("SELECT mode,active_promotion_id FROM canonical_control WHERE id=1"))[0];
            if(!control||control.mode!=='ACTIVE'||!control.active_promotion_id)throw new Error('CANON is not ACTIVE');
            if(!Array.isArray(manifest.entries)||manifest.entries.length!==10)throw new Error('manifest count is not 10');
            const resolved=[];
            for(const entry of manifest.entries){
              const rows=await query(`SELECT 'IMPORT' provenance,product_id,name FROM products WHERE promotion_id=?1 AND name=?2
                UNION ALL SELECT 'LIVE',product_id,name FROM canonical_live_products WHERE promotion_id=?1 AND name=?2`,[control.active_promotion_id,entry.product_name]);
              if(rows.length!==1)throw new Error(`exact CANON match count ${rows.length} for ${entry.product_name}`);
              resolved.push({name:entry.product_name,product_id:rows[0].product_id,provenance:rows[0].provenance});
            }
            fs.writeFileSync('/tmp/product-image-preflight.json',JSON.stringify({promotion_id:control.active_promotion_id,resolved},null,2));
            console.log(JSON.stringify({state:'PRODUCT_IMAGE_PREFLIGHT_PASS',count:resolved.length}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Export fresh production backup
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const {writeFileSync}=require('node:fs');
          const {createHash}=require('node:crypto');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const url=`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/export`;
          const headers={authorization:`Bearer ${token}`,'content-type':'application/json'};
          async function api(body){
            const response=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
            const parsed=await response.json().catch(()=>null);
            if(!response.ok||parsed?.success!==true||!parsed.result)throw new Error('D1 export API failed');
            if(parsed.result.status==='error')throw new Error('D1 export job failed');
            return parsed.result;
          }
          (async()=>{
            const start=await api({output_format:'polling'});
            if(!start.at_bookmark)throw new Error('missing backup bookmark');
            let complete=null;
            for(let attempt=0;attempt<60;attempt++){
              const result=await api({output_format:'polling',current_bookmark:start.at_bookmark});
              if(result.status==='complete'&&result.result?.signed_url){complete=result;break;}
              await new Promise(resolve=>setTimeout(resolve,2000));
            }
            if(!complete)throw new Error('D1 export did not complete');
            const download=await fetch(complete.result.signed_url);
            if(!download.ok)throw new Error('backup download failed');
            const bytes=Buffer.from(await download.arrayBuffer());
            if(!bytes.length||bytes.length>64*1024*1024)throw new Error('backup size invalid');
            const sha256=createHash('sha256').update(bytes).digest('hex');
            writeFileSync('/tmp/product-image-backup.sql',bytes);
            writeFileSync('/tmp/product-image-backup.json',JSON.stringify({bookmark:start.at_bookmark,size_bytes:bytes.length,sha256},null,2));
            console.log(JSON.stringify({state:'PRODUCT_IMAGE_BACKUP_READY',size_bytes:bytes.length,sha256}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Store backup in private R2 and verify checksum
        working-directory: tools/cloudflare-lab
        shell: bash
        run: |
          set -euo pipefail
          KEY="v1.3-product-images/batch-001/$(date -u +%Y-%m-%dT%H-%M-%SZ)-$GITHUB_SHA.sql"
          npx wrangler r2 object put "$R2_BUCKET/$KEY" --file=/tmp/product-image-backup.sql
          npx wrangler r2 object get "$R2_BUCKET/$KEY" --file=/tmp/product-image-backup-check.sql
          test "$(sha256sum /tmp/product-image-backup.sql | awk '{print $1}')" = "$(sha256sum /tmp/product-image-backup-check.sql | awk '{print $1}')"
          echo "PRODUCT_IMAGE_BACKUP_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Detect product image schema state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          (async()=>{
            const sql=`SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='canonical_product_image_events') table_n,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('canonical_product_image_events_apply_import','canonical_product_image_events_apply_live')) apply_n`;
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`,{
              method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({sql})
            });
            const body=await response.json().catch(()=>null);
            if(!response.ok||body?.success!==true)throw new Error('schema detection failed');
            const first=Array.isArray(body.result)?body.result[0]:body.result;
            const row=first?.results?.[0];
            const tableN=Number(row?.table_n),applyN=Number(row?.apply_n);
            if(![[0,0],[1,0],[1,2]].some(([a,b])=>a===tableN&&b===applyN))throw new Error(`unexpected partial product image schema ${tableN}/${applyN}`);
            fs.appendFileSync(process.env.GITHUB_ENV,`HAS_PRODUCT_IMAGE_TABLE=${tableN}\nHAS_PRODUCT_IMAGE_APPLY=${applyN}\n`);
            console.log(JSON.stringify({state:'PRODUCT_IMAGE_SCHEMA_DETECTED',table_n:tableN,apply_n:applyN}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Apply migration 0020 if missing
        if: ${{ env.HAS_PRODUCT_IMAGE_TABLE == '0' }}
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 execute "$PROD_DATABASE_NAME" --remote --file=../../infra/database/migrations/0020_canonical_product_images.sql

      - name: Apply migration 0021 if missing
        if: ${{ env.HAS_PRODUCT_IMAGE_APPLY != '2' }}
        working-directory: tools/cloudflare-lab
        run: npx wrangler d1 execute "$PROD_DATABASE_NAME" --remote --file=../../infra/database/migrations/0021_canonical_product_image_apply.sql

      - name: Verify product image schema and guards
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const database=process.env.PROD_DATABASE_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          (async()=>{
            const sql=`SELECT
              (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='canonical_product_image_events') table_n,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='canonical_product_image_events_guard_insert') insert_guard,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='canonical_product_image_events_no_update') immutable_update,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='canonical_product_image_events_no_delete') immutable_delete,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='canonical_product_image_events_apply_import') import_apply,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='canonical_product_image_events_apply_live') live_apply,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='products_no_update') import_product_guard,
              (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name='canonical_live_products_guarded_update') live_product_guard`;
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${database}/query`,{
              method:'POST',headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},body:JSON.stringify({sql})
            });
            const body=await response.json().catch(()=>null);
            if(!response.ok||body?.success!==true)throw new Error('schema verification failed');
            const first=Array.isArray(body.result)?body.result[0]:body.result;
            const row=first?.results?.[0];
            for(const [key,value] of Object.entries(row||{})) if(Number(value)!==1)throw new Error(`missing product image schema object ${key}`);
            console.log(JSON.stringify({state:'PRODUCT_IMAGE_SCHEMA_PASS'}));
          })().catch(error=>{console.error(error.message);process.exit(1)});
          NODE

      - name: Probe production Worker before image apply
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            BODY="$(curl -sS --max-time 15 "$PROD_WORKER_URL/health" || true)"
            if printf '%s' "$BODY" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const x=JSON.parse(s);process.exit(x.ok===true&&x.service==="nuevo-amanecer-pos-prod"?0:1)}catch{process.exit(1)}})'; then
              echo "PRODUCTION_WORKER_HEALTH_PASS"
              exit 0
            fi
            sleep 3
          done
          echo "Production Worker health failed" >&2
          exit 1

      - name: Apply exact 10 audited product images
        shell: bash
        run: node tools/cloudflare-prod/scripts/product-image-batch-apply.mjs apply

      - name: Verify exact 10 images through production CANON Worker
        shell: bash
        run: node tools/cloudflare-prod/scripts/product-image-batch-verify-worker.mjs

      - name: Summary
        shell: bash
        run: |
          {
            echo "## CANON product images batch 001"
            echo "- Status: APPLIED_AND_VERIFIED"
            echo "- Approved products: 10"
            echo "- Commercial/inventory fields: preserved by contract + verification"
            echo "- Protected ledgers: unchanged"
            echo "- Worker canonical read: verified"
            echo "- Backup: $PRODUCT_IMAGE_BACKUP_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
