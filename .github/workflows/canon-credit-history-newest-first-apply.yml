name: CANON Credit History Apply

on:
  push:
    branches:
      - canon/credit-history-newest-first-20261003
    paths:
      - ".github/workflows/canon-credit-history-newest-first-apply.yml"
      - "tasks/CANON-CREDIT-HISTORY-NEWEST-FIRST-001.json"
      - "evidence/canon-preflight/CANON-CREDIT-HISTORY-NEWEST-FIRST-001.json"
      - "tests/product-fixes/fix-credit-history-newest-first/**"
      - "POS/js/modules/client-credit-accounts-v2.js"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Apply exact CANON credit ordering patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('POS/js/modules/client-credit-accounts-v2.js')
          text = path.read_text(encoding='utf-8')

          if 'function labSortCreditsNewestFirst(rows)' in text:
              print('newest-first helper already present')
          else:
              start_marker = '  function labCategorySummary(client, category) {'
              end_marker = '    var closed = all.filter(labIsCanceled);'
              start = text.find(start_marker)
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('expected labCategorySummary range not found; refusing broad edit')
              end += len(end_marker)
              replacement = """  function labCreditVisualDate(cr) {
            var direct = String(cr && cr.fecha || '').slice(0, 10);
            if (/^\\d{4}-\\d{2}-\\d{2}$/.test(direct)) return direct;
            var timestampDate = String(cr && cr.timestamp || '').slice(0, 10);
            return /^\\d{4}-\\d{2}-\\d{2}$/.test(timestampDate) ? timestampDate : '';
          }

          function labCreditVisualTimestamp(cr) {
            var raw = String(cr && cr.timestamp || '');
            if (!/^\\d{4}-\\d{2}-\\d{2}T/.test(raw)) return Number.NEGATIVE_INFINITY;
            var parsed = Date.parse(raw);
            return Number.isFinite(parsed) ? parsed : Number.NEGATIVE_INFINITY;
          }

          function labSortCreditsNewestFirst(rows) {
            return (Array.isArray(rows) ? rows : []).slice().sort(function (a, b) {
              var dateOrder = labCreditVisualDate(b).localeCompare(labCreditVisualDate(a));
              if (dateOrder) return dateOrder;
              var aTime = labCreditVisualTimestamp(a), bTime = labCreditVisualTimestamp(b);
              if (aTime !== bTime) return bTime - aTime;
              return String(b && (b.ventaId || b.id) || '').localeCompare(
                String(a && (a.ventaId || a.id) || ''), 'es', { numeric:true, sensitivity:'base' }
              );
            });
          }

          function labCategorySummary(client, category) {
            var all = labCreditsForCategory(client.id, category.id);
            var active = labSortCreditsNewestFirst(all.filter(function (cr) { return !labIsCanceled(cr); }));
            var closed = labSortCreditsNewestFirst(all.filter(labIsCanceled));"""
              path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

          node --check POS/js/modules/client-credit-accounts-v2.js
          node --test tests/product-fixes/fix-credit-history-newest-first/canon-credit-history-newest-first.test.mjs

      - name: Commit patch when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- POS/js/modules/client-credit-accounts-v2.js; then
            echo "No product diff to commit."
            exit 0
          fi
          git config user.name "nuevo-amanecer-ci"
          git config user.email "actions@users.noreply.github.com"
          git add POS/js/modules/client-credit-accounts-v2.js
          git commit -m "fix(canon): ordenar créditos más recientes primero"
          git push origin "HEAD:canon/credit-history-newest-first-20261003"
