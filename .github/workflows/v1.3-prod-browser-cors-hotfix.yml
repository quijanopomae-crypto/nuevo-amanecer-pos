name: V1.3 Production Browser CORS Hotfix

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-browser-cors-hotfix-trigger.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-3-production-browser-cors-hotfix
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_WORKER_URL: https://nuevo-amanecer-pos-prod.nuevo-amanecer-pos.workers.dev
      POS_WEB_ORIGIN: https://nuevo-amanecer-pos-web.nuevo-amanecer-pos.workers.dev

    steps:
      - name: Require production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POS_ACTIVATION_SECRET"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout exact authorized HEAD
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require exact active branch head
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Install pinned Cloudflare tooling
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Browser CORS regression
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/cloud-sync/worker-cors.test.mjs
          node --test tests/cloud-sync/canonical-session-backend.test.mjs tests/cloud-sync/canonical-session-integration.test.mjs

      - name: Production Worker dry-run
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --dry-run --config ../cloudflare-prod/wrangler.jsonc

      - name: Deploy production Worker CORS hotfix
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --config ../cloudflare-prod/wrangler.jsonc

      - name: Rebind production activation secret
        working-directory: tools/cloudflare-lab
        shell: bash
        run: printf '%s' "$POS_ACTIVATION_SECRET" | npx wrangler secret put POS_ACTIVATION_SECRET --config ../cloudflare-prod/wrangler.jsonc

      - name: Verify browser preflights and health
        shell: bash
        run: |
          set -euo pipefail

          preflight() {
            local path="$1"
            local method="$2"
            local headers="$3"
            local outfile="$4"
            local code
            code="$(curl -sS -D "$outfile" -o /dev/null -w '%{http_code}' -X OPTIONS "$PROD_WORKER_URL$path"               -H "Origin: $POS_WEB_ORIGIN"               -H "Access-Control-Request-Method: $method"               -H "Access-Control-Request-Headers: $headers")"
            tr -d '\r' < "$outfile" > "$outfile.clean"
            test "$code" = "204"
            grep -qi '^access-control-allow-origin: \*$' "$outfile.clean"
          }

          preflight "/auth/activate" "POST" "x-activation-secret" /tmp/activate-headers
          grep -Eqi '^access-control-allow-headers:.*x-activation-secret' /tmp/activate-headers.clean

          preflight "/auth/session" "GET" "authorization" /tmp/session-headers
          grep -Eqi '^access-control-allow-headers:.*authorization' /tmp/session-headers.clean

          preflight "/read/canonical/status" "GET" "authorization" /tmp/read-headers
          grep -Eqi '^access-control-allow-headers:.*authorization' /tmp/read-headers.clean

          HEALTH_CODE="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$PROD_WORKER_URL/health")"
          test "$HEALTH_CODE" = "200"
          grep -Fq '"ok":true' /tmp/health.json

          echo "BROWSER_CORS_PRODUCTION_PASS"

      - name: Hotfix summary
        shell: bash
        run: |
          {
            echo "## V1.3 production browser CORS hotfix"
            echo "- Status: PASS"
            echo "- Hosted POS origin: $POS_WEB_ORIGIN"
            echo "- Activation preflight: PASS"
            echo "- Session Authorization preflight: PASS"
            echo "- Canonical read Authorization preflight: PASS"
            echo "- Production health: PASS"
            echo "- Commit: $GITHUB_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
