name: Owner Backup Recovery Drill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuevo-amanecer-production-change
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
