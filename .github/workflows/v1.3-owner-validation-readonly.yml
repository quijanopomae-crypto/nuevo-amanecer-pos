name: V1.3 Owner Validation Readonly

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/v1.3-owner-validation-trigger.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-3-owner-validation-readonly
  cancel-in-progress: false

jobs:
  validate-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      POS_ACTIVATION_SECRET: ${{ secrets.POS_ACTIVATION_SECRET }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb
      PROD_WORKER_URL: https://nuevo-amanecer-pos-prod.nuevo-amanecer-pos.workers.dev

    steps:
      - name: Require production validation credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$POS_ACTIVATION_SECRET"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Static readonly safety test
        run: |
          node --check tools/cloudflare-prod/scripts/owner-validation-readonly.mjs
          node --test tests/cloud-sync/v1.3-owner-validation-readonly.test.mjs

      - name: Validate production CANON reads without business writes
        run: node tools/cloudflare-prod/scripts/owner-validation-readonly.mjs
