name: CANON Critical CI

on:
  pull_request:
    paths:
      - "POS/**"
      - "tests/product-fixes/**"
      - "tests/cloud-sync/**"
      - "tools/cloudflare-lab/**"
      - "tools/cloudflare-prod/**"
      - "tools/cloudflare-staging/**"
      - "tools/cloudflare-pos-web/**"
      - "tools/pos-experience/**"
      - ".github/workflows/*.yml"
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "POS/**"
      - "tests/product-fixes/**"
      - "tests/cloud-sync/**"
      - "tools/cloudflare-lab/**"
      - "tools/cloudflare-prod/**"
      - "tools/cloudflare-staging/**"
      - "tools/cloudflare-pos-web/**"
      - "tools/pos-experience/**"
      - ".github/workflows/*.yml"

permissions:
  contents: read

jobs:
  critical-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: JavaScript syntax
        run: |
          find POS/js tools/cloudflare-lab/src tools/cloudflare-pos-web/src tools/pos-experience -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check

      - name: Product and cloud regression suites
        run: |
          node --test tests/product-fixes/*.test.mjs
          node --test tests/cloud-sync/*.test.mjs

      - name: Install Cloudflare lab dependencies
        working-directory: tools/cloudflare-lab
        run: npm ci --no-audit --no-fund

      - name: Production workflow serialization and staging isolation guards
        run: node --test tests/cloud-sync/production-workflow-lock.test.mjs tests/cloud-sync/staging-isolation-contract.test.mjs tests/cloud-sync/database-binding-compat.test.mjs

      - name: Production Worker dry-run
        working-directory: tools/cloudflare-lab
        run: npx wrangler deploy --dry-run --config ../cloudflare-prod/wrangler.jsonc
