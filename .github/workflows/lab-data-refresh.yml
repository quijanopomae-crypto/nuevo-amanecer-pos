name: Refresh LAB Data

on:
  workflow_dispatch:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - "ops/lab-data-refresh-trigger.json"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_CANON_READ_TOKEN: ${{ secrets.R2_CANON_READ_TOKEN }}
      LAB_IMPORT_HMAC_SECRET: ${{ secrets.LAB_IMPORT_HMAC_SECRET }}

    steps:
      - name: Require separated refresh secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$R2_CANON_READ_TOKEN"
          test -n "$LAB_IMPORT_HMAC_SECRET"

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Require current active branch head
        run: |
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"

      - name: Test backup contract, SQL converter and secret separation
        run: |
          node --test tools/cloudflare-lab/test/canon-backup-manifest.test.mjs
          python3 -m unittest tools/cloudflare-lab/test/test_lab_snapshot_from_sql.py
          node --test tests/security-secret-separation.test.mjs

      - name: Fetch latest CANON SQL backup
        working-directory: tools/cloudflare-lab
        run: node scripts/fetch-latest-canon-backup.mjs

      - name: Convert CANON SQL to POS snapshot
        working-directory: tools/cloudflare-lab
        run: python3 scripts/lab-snapshot-from-sql.py --sql /tmp/canon.sql --output /tmp/lab-snapshot.json

      - name: Require products and customers in LAB snapshot
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const snapshot = JSON.parse(fs.readFileSync('/tmp/lab-snapshot.json', 'utf8'));
          const productos = Array.isArray(snapshot?.data?.productos) ? snapshot.data.productos.length : 0;
          const clientes = Array.isArray(snapshot?.data?.clientes) ? snapshot.data.clientes.length : 0;
          console.log(JSON.stringify({ state: 'LAB_SNAPSHOT_COUNTS', productos, clientes }));
          if (productos < 1) throw new Error('LAB snapshot has zero productos');
          if (clientes < 1) throw new Error('LAB snapshot has zero clientes');
          NODE

      - name: Publish signed baseline to D1 LAB
        working-directory: tools/cloudflare-lab
        run: node scripts/publish-lab-snapshot.mjs
