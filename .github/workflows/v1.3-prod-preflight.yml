name: V1.3 Production Read-Only Preflight
# 2026-10-01: owner-authorized read-only rerun for debt reconciliation schema diagnosis

on:
  push:
    branches:
      - feature/v1.3-mobile-cloud
    paths:
      - ".github/workflows/v1.3-prod-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-3-production-read-only-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_DATABASE_ID: cf2c83d3-f187-472e-967b-0ad24be969eb
    steps:
      - name: Require credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | grep -Eq '^[a-f0-9]{32}$'

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require exact branch head
        run: |
          test "$GITHUB_REF_NAME" = "feature/v1.3-mobile-cloud"
          git fetch origin feature/v1.3-mobile-cloud --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/feature/v1.3-mobile-cloud)"

      - name: Query production D1 read-only
        shell: bash
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const database = process.env.PROD_DATABASE_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const url = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/d1/database/' + database + '/query';

          async function query(label, sql) {
            const response = await fetch(url, {
              method: 'POST',
              headers: {
                authorization: 'Bearer ' + token,
                'content-type': 'application/json',
              },
              body: JSON.stringify({ sql }),
            });
            const parsed = await response.json().catch(() => null);
            if (!response.ok || parsed?.success !== true) {
              const message = parsed?.errors?.map(x => x?.message).filter(Boolean).join('; ') || 'unknown';
              throw new Error(label + ' failed (' + response.status + '): ' + message);
            }
            const result = Array.isArray(parsed.result) ? parsed.result[0] : parsed.result;
            if (!result || result.success === false) throw new Error(label + ' returned failure');
            return Array.isArray(result.results) ? result.results : [];
          }

          (async () => {
            const control = (await query('control', `
              SELECT mode, active_promotion_id, revision, authority_epoch,
                     minimum_client_contract, first_live_operation_id
              FROM canonical_control WHERE id=1;
            `))[0];
            if (!control) throw new Error('canonical_control missing');

            const schema = (await query('schema', `
              SELECT
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='auth_sessions') AS has_auth_sessions,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='canonical_financial_operations') AS has_financial_operations,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='canonical_write_guards') AS has_write_guards,
                COALESCE((SELECT instr(sql,'principal_id') > 0 FROM sqlite_master WHERE type='table' AND name='canonical_write_guards'),0) AS write_guard_has_principal_id,
                COALESCE((SELECT instr(sql,'credential_hash') > 0 FROM sqlite_master WHERE type='table' AND name='canonical_write_guards'),0) AS write_guard_has_credential_hash,
                COALESCE((SELECT instr(sql,'NEW.principal_id') > 0 FROM sqlite_master WHERE type='trigger' AND name='canonical_write_guards_authorized_insert'),0) AS session_guard_trigger;
            `))[0];

            const customerCreateDeps = (await query('customer_create_dependencies', `
              SELECT
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='canonical_assertions') AS canonical_assertions,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='canonical_customer_credit_policy_operations') AS policy_operations,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='table' AND name='canonical_customer_credit_policies') AS policies,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_policy_collision') AS customer_policy_collision_trigger,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_namespace_insert') AS customer_namespace_trigger,
                EXISTS(SELECT 1 FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_authorized_insert') AS customer_authorized_trigger,
                COALESCE((SELECT instr(COALESCE(sql,''),'writer_device_id') > 0 FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_authorized_insert'),0) AS customer_authorized_uses_writer_device_id,
                COALESCE((SELECT instr(COALESCE(sql,''),'d.device_id=NEW.principal_id') > 0 FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_authorized_insert'),0) AS customer_authorized_uses_principal_id,
                COALESCE((SELECT length(COALESCE(sql,'')) FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_authorized_insert'),0) AS customer_authorized_sql_length,
                COALESCE((SELECT length(COALESCE(sql,'')) FROM sqlite_master WHERE type='trigger' AND name='canonical_customer_operations_namespace_insert'),0) AS customer_namespace_sql_length,
                COALESCE((SELECT length(COALESCE(sql,'')) FROM sqlite_master WHERE type='trigger' AND name='canonical_live_customers_authorized_insert'),0) AS live_customer_authorized_sql_length;
            `))[0];

            const traffic = (await query('traffic', `
              SELECT
                (SELECT COUNT(*) FROM sales) AS sales,
                (SELECT COUNT(*) FROM sale_items) AS sale_items,
                (SELECT COUNT(*) FROM cash_movements) AS cash_movements,
                (SELECT COUNT(*) FROM inventory_movements) AS inventory_movements,
                (SELECT COUNT(*) FROM sync_operations) AS sync_operations;
            `))[0];

            const requiredMigrations = [
              '0014_canonical_live_products.sql',
              '0015_canonical_inventory_adjust.sql',
              '0016_canonical_generic_sale_lines.sql',
              '0017_canonical_live_customers.sql',
            ];
            const allMigrationRows = await query('d1_migrations',
              'SELECT name FROM d1_migrations ORDER BY name;');
            const observedMigrations = allMigrationRows.map(row => String(row.name));
            const missingMigrations = requiredMigrations.filter(name => !observedMigrations.includes(name));

            const quickRows = await query('quick_check', 'PRAGMA quick_check;');
            const quickCheck = String(Object.values(quickRows[0] || {})[0] || '').toLowerCase();
            const foreignKeyRows = await query('foreign_key_check', 'PRAGMA foreign_key_check;');

            const requiredObjects = {
              table: [
                'canonical_product_operations',
                'canonical_live_products',
                'canonical_live_inventory_effects',
                'canonical_inventory_operations',
                'canonical_manual_inventory_movements',
                'canonical_generic_sale_lines',
                'canonical_customer_operations',
                'canonical_customer_registry',
                'canonical_live_customers',
                'canonical_sale_context',
                'live_credits',
                'canonical_credit_accounts',
                'canonical_credit_metadata',
              ],
              view: ['canonical_credit_balances','canonical_cash_state'],
              index: [
                'ux_canonical_live_customers_document',
                'idx_sale_context_promotion',
                'idx_live_credits_customer',
                'idx_credit_accounts_name',
                'idx_credit_metadata_customer',
              ],
              trigger: [
                'canonical_customer_operations_authorized_insert',
                'canonical_customer_registry_live_guard',
                'canonical_live_customers_authorized_insert',
                'canonical_sale_context_authorized_insert',
                'live_credits_authorized_insert',
                'credit_accounts_authorized_insert',
                'credit_metadata_live_guard',
                'cash_session_unique_open',
                'sale_cash_requires_open_session',
              ],
            };
            const expectedObjects = Object.entries(requiredObjects).flatMap(([type,names]) => names.map(name => ({ type, name })));
            const quotedObjectNames = expectedObjects.map(item => "'" + item.name + "'").join(',');
            const objectRows = await query('sqlite_master 0017 objects',
              'SELECT type,name FROM sqlite_master WHERE name IN (' + quotedObjectNames + ') ORDER BY type,name;');
            const missingSchemaObjects = expectedObjects
              .filter(expected => !objectRows.some(row => String(row.type) === expected.type && String(row.name) === expected.name))
              .map(item => item.type + ':' + item.name);

            const residueRows = await query('__v17 residue',
              "SELECT type,name FROM sqlite_master WHERE name LIKE '%__v17%' OR instr(COALESCE(sql,''),'__v17') > 0;");

            const customerFkTables = [
              'canonical_sale_context',
              'live_credits',
              'canonical_credit_accounts',
              'canonical_credit_metadata',
            ];
            const existingTableNames = new Set(objectRows.filter(row => String(row.type) === 'table').map(row => String(row.name)));
            const missingCustomerRegistryFks = [];
            for (const table of customerFkTables) {
              if (!existingTableNames.has(table)) {
                missingCustomerRegistryFks.push(table + ':table_missing');
                continue;
              }
              const rows = await query('foreign key ' + table, 'PRAGMA foreign_key_list("' + table + '");');
              if (!rows.some(row => String(row.table) === 'canonical_customer_registry')) {
                missingCustomerRegistryFks.push(table);
              }
            }

            const migrationSchemaStatus = {
              '0014_canonical_live_products.sql': [
                'canonical_product_operations',
                'canonical_live_products',
                'canonical_live_inventory_effects',
              ].every(name => existingTableNames.has(name)) ? 'PRESENT' : 'MISSING_OR_PARTIAL',
              '0015_canonical_inventory_adjust.sql': [
                'canonical_inventory_operations',
                'canonical_manual_inventory_movements',
              ].every(name => existingTableNames.has(name)) ? 'PRESENT' : 'MISSING_OR_PARTIAL',
              '0016_canonical_generic_sale_lines.sql':
                existingTableNames.has('canonical_generic_sale_lines') ? 'PRESENT' : 'MISSING_OR_PARTIAL',
              '0017_canonical_live_customers.sql': [
                'canonical_customer_operations',
                'canonical_customer_registry',
                'canonical_live_customers',
              ].every(name => existingTableNames.has(name)) &&
                missingCustomerRegistryFks.length === 0 &&
                residueRows.length === 0 ? 'PRESENT' : 'MISSING_OR_PARTIAL',
            };

            const customerSchemaCounts = {};
            for (const table of [
              'canonical_customer_operations',
              'canonical_customer_registry',
              'canonical_live_customers',
              'canonical_sale_context',
              'live_credits',
              'canonical_credit_accounts',
              'canonical_credit_metadata',
            ]) {
              if (!existingTableNames.has(table)) {
                customerSchemaCounts[table] = null;
                continue;
              }
              const count = (await query('row count ' + table, 'SELECT COUNT(*) AS n FROM "' + table + '";'))[0]?.n;
              customerSchemaCounts[table] = Number(count || 0);
            }

            let financialOperations = 0;
            if (Number(schema.has_financial_operations) === 1) {
              financialOperations = Number((await query('financial_operations',
                'SELECT COUNT(*) AS n FROM canonical_financial_operations;'))[0]?.n || 0);
            }
            let activeSessions = 0;
            if (Number(schema.has_auth_sessions) === 1) {
              activeSessions = Number((await query('active_sessions',
                "SELECT COUNT(*) AS n FROM auth_sessions WHERE status='active';"))[0]?.n || 0);
            }
            traffic.financial_operations = financialOperations;
            traffic.active_sessions = activeSessions;

            const result = {
              database_id: database,
              control: {
                mode: control.mode,
                active_promotion_id: control.active_promotion_id,
                revision: Number(control.revision),
                authority_epoch: Number(control.authority_epoch),
                minimum_client_contract: control.minimum_client_contract,
                first_live_operation_id: control.first_live_operation_id,
              },
              schema: Object.fromEntries(Object.entries(schema).map(([k,v]) => [k, Number(v)])),
              customer_create_dependencies: Object.fromEntries(Object.entries(customerCreateDeps || {}).map(([k,v]) => [k, Number(v)])),
              traffic: Object.fromEntries(Object.entries(traffic).map(([k,v]) => [k, Number(v)])),
              observed_migrations: observedMigrations,
              missing_migrations: missingMigrations,
              migration_schema_status: migrationSchemaStatus,
              integrity: {
                quick_check: quickCheck,
                foreign_key_violations: foreignKeyRows.length,
                v17_residue_objects: residueRows.length,
              },
              missing_schema_objects: missingSchemaObjects,
              missing_customer_registry_fks: missingCustomerRegistryFks,
              customer_schema_counts: customerSchemaCounts,
              schema_objects_verified: expectedObjects.length - missingSchemaObjects.length,
              migration_0017_readonly_proof:
                migrationSchemaStatus['0017_canonical_live_customers.sql'] === 'PRESENT' &&
                quickCheck === 'ok' &&
                foreignKeyRows.length === 0 &&
                residueRows.length === 0 &&
                missingSchemaObjects.length === 0 &&
                missingCustomerRegistryFks.length === 0 ? 'PASS' : 'FAIL',
              read_only_preflight: 'PASS',
            };
            console.log(JSON.stringify(result));

            const failures = [];
            if (Number(customerCreateDeps?.canonical_assertions)!==1) failures.push('canonical_assertions missing');
            if (Number(customerCreateDeps?.customer_policy_collision_trigger)===1 && Number(customerCreateDeps?.policy_operations)!==1) failures.push('customer policy collision trigger references missing policy operations table');
            if (Number(customerCreateDeps?.customer_namespace_trigger)!==1) failures.push('customer namespace trigger missing');
            if (Number(customerCreateDeps?.customer_authorized_trigger)!==1) failures.push('customer authorized trigger missing');
            if (control.mode !== 'ACTIVE') failures.push('production canonical authority is not ACTIVE');
            if (!control.active_promotion_id) failures.push('active promotion missing');
            const effectiveMissingMigrations = Object.entries(migrationSchemaStatus)
              .filter(([,status]) => status !== 'PRESENT')
              .map(([name]) => name);
            if (effectiveMissingMigrations.length) failures.push('effective schema missing migrations: ' + effectiveMissingMigrations.join(','));
            if (quickCheck !== 'ok') failures.push('PRAGMA quick_check=' + quickCheck);
            if (foreignKeyRows.length) failures.push('foreign key violations=' + foreignKeyRows.length);
            if (residueRows.length) failures.push('__v17 residue=' + residueRows.length);
            if (missingSchemaObjects.length) failures.push('missing schema objects: ' + missingSchemaObjects.join(','));
            if (missingCustomerRegistryFks.length) failures.push('missing customer registry FKs: ' + missingCustomerRegistryFks.join(','));
            if (failures.length) throw new Error(failures.join(' | '));
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
