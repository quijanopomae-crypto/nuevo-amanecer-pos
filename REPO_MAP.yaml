schema: nuevo-amanecer.repo-map/v1

status:
  active_branch: feature/v1.3-mobile-cloud
  production_baseline: v1.2-production
  v1_3: ready_for_first_sale
  production_cutover: ready_for_first_sale
  remote_paid_or_production_actions: owner_authorized_to_ready_for_first_sale

sources_of_truth:
  current_status: docs/V1.3_STATUS.md
  work_modes_and_git_boundaries: AGENTS.md
  product_rules: AGENTS_Nuevo_Amanecer.md
  agent_role_map: .opencode/ROLE_MAP.md
  branch_preview_workflow: docs/BRANCH_PREVIEW_WORKFLOW.md
  lab_retirement: docs/LAB_RETIREMENT.md
  security_phase: docs/REMEDIATION_PHASE7_SECURITY.md

zones:
  canon_product:
    path: POS/
    authority: product
    runtime_must_not_depend_on:
      - laboratorio/
  local_launcher:
    paths:
      - INICIAR_POS.cmd
      - tools/pos-local/
  retired_pos_lab:
    path: laboratorio/pos-lab/
    authority: historical_read_only
    runtime: disabled
    promotion_source: false
    new_writes: forbidden
  branch_preview:
    authority: validation_only
    source: exact_pr_sha
    persistent_product_copy: false
    merge_authority: owner_only
  backend_runtime_legacy_path:
    path: tools/cloudflare-lab/
    authority: canon_backend_and_test_tooling
    note: historical_name_do_not_delete_or_rename_in_pos_lab_retirement
    worker: tools/cloudflare-lab/src/worker.js
    workspace: tools/cloudflare-lab/src/lab-workspace.js
    migrations: infra/database/migrations/
    session_auth_migration: infra/database/migrations/0010_session_auth.sql
    private_inputs: tools/cloudflare-lab/private/
  backup_recovery:
    path: tools/cloudflare-backup/
    authority: backup_tooling
  tests:
    path: tests/
    critical_groups:
      - tests/product-fixes/
      - tests/cloud-sync/
      - tests/infrastructure/
      - tests/security-secret-separation.test.mjs
      - tests/repo-map.test.mjs
  agents:
    definitions: .opencode/agents/
    commands: .opencode/commands/
    skills: .agents/skills/
    canon_writer: .opencode/agents/pos-canon-implementer.md
    shadow_legacy_writer_name: .opencode/agents/pos-implementer.md
  evidence:
    path: evidence/
    authority: historical_or_task_evidence
    rule: never_treat_as_current_state_without_cross_check
  shadow_infrastructure:
    paths:
      - MANIFEST.yaml
      - orchestrator/
      - infra/
    authority: shadow_or_historical_baseline
    rule: not_a_gate_for_normal_product_work_unless_explicitly_invoked

cloud_data:
  d1:
    repository_schema: infra/database/migrations/
    remote_database: not_source_controlled
    local_ci_migrations: allowed
    remote_migrations: owner_only
  r2:
    repository_data: none
    role: backup_transport
    credential: R2_CANON_READ_TOKEN
    worker_binding: forbidden
  secrets:
    pos_activation_secret: POS_ACTIVATION_SECRET
    historical_lab_import_hmac:
      name: LAB_IMPORT_HMAC_SECRET
      status: retired_not_managed_by_current_owner_finalizer
    values_in_git: forbidden

v1_3_runtime:
  active_local_components:
    - POS/
    - tools/cloudflare-lab/src/worker.js
    - tools/cloudflare-lab/src/lab-workspace.js
  production:
    worker: nuevo-amanecer-pos-prod
    runtime_enabled: true
    authority_mode: ACTIVE
    session_auth_migration_applied: true
    session_runtime_migration_applied: true
    ready_for_first_sale: true
    first_live_operation_id: null
    operational_traffic_at_gate: 0
    cutover_run: 36054220606
    canon_critical_ci_run: 36054220605
  dormant_checkpoint_components: []
  runtime_activation: production_active_ready_for_first_sale
  activation_migration_present: false

ci:
  workflows:
    canon_critical: .github/workflows/canon-critical-ci.yml
    e2e_smoke: .github/workflows/e2e-smoke-ci.yml
    opencode_and_repo_map: .github/workflows/opencode-config-ci.yml
  policy:
    actions_pinned_to_sha: true
    branch_preview_required: true
    preview_must_match_pr_sha: true
    merge_owner_only: true
    production_deploy_separate_from_merge: true

historical_or_gate_specific_docs:
  note: These documents are evidence or contracts for a specific gate; they do not override current status.
  paths:
    - docs/V1.2_STATUS.md
    - docs/V1.3_A2_DEVICE_AUTH.md
    - docs/V1.3_A3_SALE_CREATE.md
    - docs/V1.3_A4_OFFLINE_OUTBOX.md
    - docs/V1.3_A5_MIGRATION_RECONCILIATION.md
    - docs/V1.3_A6_CANONICAL_PROMOTION_CUTOVER.md
    - docs/V1.3_A6_GATE_P_LOCAL_IMPLEMENTATION.md
    - docs/REMEDIATION_PHASE1_POLICY_SOURCES.md
    - docs/REMEDIATION_PHASE2_IMPORT_SAFETY.md
    - docs/REMEDIATION_PHASE3_WORKSPACE_RECOVERY.md
    - docs/REMEDIATION_PHASE4A_TASK_GUARDS.md
    - docs/REMEDIATION_PHASE5_CHECKPOINT_CLASSIFICATION.md

do_not_delete_without_phase9_proof:
  - CVV1.1.html
  - CVV2.4_backup_antes_demo-1.html
  - nuevo-amanecer-pos-engineer.zip
  - POS/js/legacy-inline/
  - POS/js/compat/legacy-globals.js
  - evidence/

branch_hygiene:
  classification: docs/REMEDIATION_PHASE9_BRANCH_CLASSIFICATION.md
  active: feature/v1.3-mobile-cloud
  preserve_unique:
    - checkpoint/v1.3-pc-20260923
  merged_recoverable_refs: 24
  safe_file_deletions_demonstrated: 0
  remote_branch_refs_deleted: false
  branch_ref_deletion_note: connected_tool_has_no_branch_delete_action

final_verification:
  report: docs/REMEDIATION_FINAL_VERIFICATION.md
  repository_code_state: CODE_REMEDIATION_PASS
  overall_clean_pass: false
  remaining_state: FIRST_LIVE_SALE_AND_RELEASE_FINALIZATION
  blockers:
    - real_first_live_sale
    - post_sale_canonical_validation
    - final_v1_3_release_declaration
  production_cutover_authorized: true
  production_preparation_status: READY_FOR_FIRST_SALE

owner_finalizer:
  script: tools/owner-finalize-v1.3.ps1
  instructions: docs/OWNER_FINALIZATION.md
  recovery_drill_workflow: .github/workflows/owner-backup-recovery-drill.yml
  status: UPDATED_FOR_POS_LAB_RETIREMENT


motion:
  architecture_map: docs/MOTION_MAP.yaml
  namespace: window.NA_MOTION
  js_root: POS/js/motion/
  css_root: POS/css/motion/
  authority: visual_only
  business_authority: false
  storage_authority: false
  network_authority: false
  reduced_motion: required
  pilot_consumer: POS/js/modules/client-credit-accounts-v2.js
