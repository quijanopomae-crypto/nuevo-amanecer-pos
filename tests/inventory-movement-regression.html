<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Regresión: movimiento de inventario</title>
<style>body{font:14px system-ui;margin:20px;background:#f8fafc;color:#172033}button{padding:9px 13px;font-weight:700}.ok{color:#087443}.fail{color:#b42318}table{border-collapse:collapse;margin-top:16px;background:#fff}td,th{border:1px solid #d8e0ea;padding:8px;text-align:left}iframe{width:1px;height:1px;border:0;position:absolute}</style>
<h1>Prueba de regresión: movimiento de inventario</h1>
<p id="status">Esperando inicio…</p><button id="run">Ejecutar prueba aislada</button>
<table><thead><tr><th>Caso</th><th>Resultado</th></tr></thead><tbody id="results"></tbody></table>
<iframe id="pos" src="../CVV2.4_backup_antes_demo-1.html"></iframe>
<script>
(() => {
  const PREFIX='**PRUEBA_POS_NO_USAR**', SKU='TEST-POS-HARNESS-001', PRODUCT_ID=987654321001;
  const out=document.querySelector('#results'), status=document.querySelector('#status'), run=document.querySelector('#run'), frame=document.querySelector('#pos');
  const add=(name,value,ok)=>{const row=document.createElement('tr'),a=document.createElement('td'),b=document.createElement('td');a.textContent=name;b.textContent=value;b.className=ok?'ok':'fail';row.append(a,b);out.append(row);};
  const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const read=(win,expression)=>win.eval(expression);
  async function waitReady(win){for(let i=0;i<100;i++){if(typeof win.guardarMovInv==='function'&&typeof win.saveAllData==='function'&&win.document.querySelector('#mMovInv'))return;await wait(50);}throw new Error('El POS no terminó de inicializar');}
  async function ensureProduct(win){
    let product=read(win,`productos.find(p=>p.sku===${JSON.stringify(SKU)})`);
    if(product)return product;
    win.abrirModalProd();
    const d=win.document;d.querySelector('#pNombre').value=`${PREFIX} Galleta`;d.querySelector('#pSku').value=SKU;d.querySelector('#pBarcode').value='990000000002';d.querySelector('#pCosto').value='1';d.querySelector('#pPrecio').value='2';d.querySelector('#pStock').value='15';
    await win.guardarProd();
    product=read(win,`productos.find(p=>p.sku===${JSON.stringify(SKU)})`);
    if(!product)throw new Error('No se pudo crear el producto de prueba mediante el flujo real');
    return product;
  }
  async function runMove(win,id,amount){
    win.abrirMovInv(id,'entrada');
    const d=win.document,modal=d.querySelector('#mMovInv'),input=d.querySelector('#mMovCant'),button=modal.querySelector('button[onclick="guardarMovInv()"]');
    if(!modal.classList.contains('open')||!button)throw new Error('No se abrió el modal real de movimiento');
    input.value=String(amount);input.dispatchEvent(new win.Event('input',{bubbles:true}));
    return {button,invoke:()=>win.guardarMovInv()};
  }
  run.addEventListener('click',async()=>{
    run.disabled=true;out.replaceChildren();status.textContent='Ejecutando…';
    try{
      if(frame.contentDocument?.readyState!=='complete')await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
      const win=frame.contentWindow;await waitReady(win);const product=await ensureProduct(win),id=product.id;
      const before=read(win,`productos.find(p=>p.id===${JSON.stringify(id)}).stock`),move=await runMove(win,id,5);
      const first=move.invoke(),disabledAfterFirst=move.button.disabled,second=move.invoke();await Promise.all([first,second]);await wait(50);
      const after=read(win,`productos.find(p=>p.id===${JSON.stringify(id)}).stock`),successes=[...win.document.querySelectorAll('#gToast.show.success')].length;
      const doubleOk=after===before+5&&disabledAfterFirst&&move.button.disabled===false&&successes<=1;
      add('Doble invocación',`antes ${before}; solicitado 5; después ${after}; incremento ${after-before}; botón bloqueado ${disabledAfterFirst}; éxitos visibles ${successes}`,doubleOk);
      const original=win.saveAllData;let failed=false;
      try{
        win.saveAllData=async()=>{if(!failed){failed=true;return {ok:false,durable:false,verified:false,temporary:false};}return original();};
        const rollbackBefore=read(win,`productos.find(p=>p.id===${JSON.stringify(id)}).stock`),rollbackMove=await runMove(win,id,5);await rollbackMove.invoke();await wait(50);
        const rollbackAfter=read(win,`productos.find(p=>p.id===${JSON.stringify(id)}).stock`);
        add('Rollback controlado',`antes ${rollbackBefore}; después ${rollbackAfter}; botón habilitado ${!rollbackMove.button.disabled}; fallo interceptado ${failed}`,rollbackAfter===rollbackBefore&&!rollbackMove.button.disabled&&failed);
      }finally{win.saveAllData=original;}
      const errors=read(win,'[]');add('Errores no controlados',String(errors.length),errors.length===0);status.textContent='Prueba finalizada';
    }catch(error){add('Harness',error.message||String(error),false);status.textContent='FALLIDO: no se confirmó el estado real';}
    finally{run.disabled=false;}
  });
})();
</script>
