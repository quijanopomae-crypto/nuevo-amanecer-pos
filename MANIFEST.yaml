schema: nuevo-amanecer.orchestrator/manifest@1.0.0-rc1
strict: true
metadata:
  name: nuevo-amanecer-shadow
  manifest_revision: 3
  environment: shadow
runtime:
  engine: opencode
  interface: desktop
  version:
    policy: exact
    value: "1.18.18"
  skills_source: .agents/skills
  forbidden_paths:
    - .opencode/skills
models:
  primary-implementation:
    transport: opencode
    model_id: deepseek/deepseek-v4-pro
    variant: primary
  conditional-second-engineer:
    transport: opencode
    model_id: zai-coding-plan/glm-5.3
    variant: reasoning=max
  external-forensic:
    transport: manual-handoff
    model_id: codex-app
    variant: high-critical-release
capabilities:
  project-read:
    kind: read
  infra-write:
    kind: write
  test-execute:
    kind: tests
  git-inspect:
    kind: git
roles:
  planner:
    mode: primary
    runtime_agent_id: pos-planner
    model_ref: primary-implementation
    capabilities:
      - project-read
      - git-inspect
  implementer:
    mode: worker
    runtime_agent_id: pos-implementer
    model_ref: primary-implementation
    capabilities:
      - project-read
      - infra-write
      - git-inspect
  tester:
    mode: worker
    runtime_agent_id: pos-tester
    model_ref: primary-implementation
    capabilities:
      - project-read
      - test-execute
      - git-inspect
  reviewer:
    mode: reviewer
    runtime_agent_id: pos-reviewer
    model_ref: conditional-second-engineer
    capabilities:
      - project-read
      - test-execute
      - git-inspect
workflow:
  entry_role: planner
  allowed_roles:
    - planner
    - implementer
    - tester
    - reviewer
paths:
  schemas: orchestrator/schemas
  state: orchestrator/state
  policies: orchestrator/policies
  skills: .agents/skills
  agents: .opencode/agents
  commands: .opencode/commands
  tests: tests/infrastructure
  fixtures: fixtures/shadow
  evidence: evidence
skills:
  canonical_source: .agents/skills
  required:
    - feature-spec
    - impact-analysis
    - dependency-map
    - inventory-integrity
    - cash-integrity
    - credits-integrity
    - cross-module-impact
    - evidence-pack
    - release-readiness
policies:
  unknown_properties: reject
  duplicate_ids: reject
  allowed_variables:
    - MANIFEST_DIR
    - USERPROFILE
    - LOCALAPPDATA
    - APPDATA
    - PWD
  allowed_path_roots:
    - orchestrator
    - .agents
    - .opencode
    - tests
    - fixtures
    - evidence
routing:
  primary_implementer:
    role: implementer
    model_ref: primary-implementation
  second_engineer:
    role: reviewer
    model_ref: conditional-second-engineer
    risks:
      - HIGH
      - CRITICAL
  critical_reviewer:
    model_ref: external-forensic
    risks:
      - HIGH
      - CRITICAL
    critical_topics:
      - integridad financiera
      - corrupción de datos
      - persistencia crítica
      - seguridad
      - arquitectura compartida crítica
    denied_failure_classes:
      - RESOURCE_LIMIT
      - PROVIDER_FAILURE
      - EXTERNAL_DEPENDENCY
      - TOOL_FAILURE
    admit_on_release_gate: true
    admit_after_review_exhausted: true
    deny_cosmetic: true
  blocked_failure_classes:
    - RESOURCE_LIMIT
    - PROVIDER_FAILURE
    - EXTERNAL_DEPENDENCY
    - TOOL_FAILURE
    - WRONG_WORKTREE
shadow_write_policy:
  product_write: DENIED
  writable_path_ref: evidence
integrity:
  algorithm: sha256
  canonicalization: rfc8785-jcs-subset-v1
  manifest_sha256: sha256:c8532a6c0651088b42eee39d9dce2710c6b428c07807f027de6acd9c16b23bf6
